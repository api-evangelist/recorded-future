name: Recorded Future API conventions
generated: '2026-10-20'
method: searched
source: https://docs.recordedfuture.com/reference/get-started.md
authentication:
  style: API token header
  detail: 'X-RFToken for most endpoints and PFI; apikey header for ASI (api.securitytrails.com); Authorization: Bearer for
    Sandbox and RiskRecon. Tokens generated by an Enterprise Administrator; entitlements follow licensed modules.'
  see: authentication/recorded-future-authentication.yml
idempotency:
  coverage: none
  note: No Idempotency-Key header or replay protection documented.
pagination:
  style: offset/limit (varies by API family)
  note: Playbook Alerts /search added an offset parameter in v1.2.0.
request_tracing:
  field: traceId
  note: Returned in v2 error bodies; save it for support escalation.
errors:
  envelope: '{"error": {"status", "message", "reason"}, "traceId"}'
  see: errors/recorded-future-error-codes.yml
rate_limit_signaling:
  status: 429
  see: rate-limits/recorded-future-rate-limits.yml
versioning:
  see: lifecycle/recorded-future-lifecycle.yml
reversibility:
  status: documented
  note: Delete/remove operations exist in the contracts; no reversal window is stated in the docs.
  surfaces:
  - surface: List entities
    reversal: POST /list/{listId}/entity/remove reverses /entity/add
    operationId: null
    window: null
  - surface: ASI asset tags
    reversal: Assets-remove_tag_from_asset reverses Assets-apply_tag_to_asset
    operationId: Assets-remove_tag_from_asset
    window: null
  - surface: Cases
    reversal: delete / deleteMany remove a created case
    operationId: delete
    window: null
