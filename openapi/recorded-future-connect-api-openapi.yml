      summary: Stat a IP Address risk list
      tags:
      - IP
      x-readme:
        explorer-enabled: false
      description: 'Check IP address risk list for changes via ETag headers without downloading the full file.

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/FormatParameter'
