openapi: 3.1.1
info:
  title: Connect API
  version: 2.0.0
  description: 'A collection of APIs suitable for a number of use cases.


    Further documentation is available at [Recorded Future Docs](https://docs.recordedfuture.com/reference/get-started)

    '
servers:
- url: https://api.recordedfuture.com/v2
paths:
  /company/by_domain/{domain}:
    get:
      summary: Lookup Company by domain
      tags:
      - Company
      description: 'Resolve a domain to its associated company entity with risk scoring and threat intelligence enrichment.

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/DomainParameter'
      - $ref: '#/components/parameters/FieldsParameter'
      - $ref: '#/components/parameters/MetadataParameter'
      - $ref: '#/components/parameters/CommentParameter'
      responses:
        '200':
          description: Result of operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyByDomainResponse'
              example:
                data:
                  risk:
                    criticalityLabel: Moderate
                    riskString: 15/54
                    rules: 15
                    criticality: 2
                    riskSummary: 15 of 54 Risk Rules currently observed.
                    score: 64
                    evidenceDetails:
                    - mitigationString: ''
                      evidenceString: '18 sightings on 1 source: Insikt Group. 18 reports including Sample of Sarcoma Ransomware Shared on X, Available From Recorded Future Malware Intelligence. Most recent link (Apr 24, 2025): https://app.recordedfuture.com/portal/analyst-note/doc:5fxKuB'
