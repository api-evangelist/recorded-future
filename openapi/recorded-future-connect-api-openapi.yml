  schemas:
    Entity:
      type: object
      description: Recorded Future entity identification.
      properties:
        id:
          type: string
          description: 'Recorded Future entity ID. Format varies by type: ip:1.2.3.4, idn:example.com, hash:<value>, url:https://..., or opaque alphanumeric IDs for vulnerabilities, malware, and companies.'
        name:
          type: string
          description: Human-readable entity name.
        type:
          type: string
          description: Entity type classification.
          enum:
          - IpAddress
          - InternetDomainName
          - Hash
          - URL
          - CyberVulnerability
          - Malware
          - Company
        description:
          type: string
          description: Entity description (present for vulnerabilities and some other types).
      required:
      - id
      - name
      - type
    EvidenceDetail:
      type: object
      description: Evidence for a triggered risk rule, including the rule name, severity, and supporting evidence string.
      properties:
        rule:
          type: string
          description: Risk rule name that was triggered.
        criticality:
          type: integer
          description: Numeric criticality level of the rule (1=Informational, 2=Unusual, 3=Suspicious, 4=Malicious).
        criticalityLabel:
          type: string
          description: 'Human-readable criticality label. IOC entities use: Unusual, Suspicious, Malicious, Very Malicious. Company entities use: Informational, Moderate, High, Very High.'
          enum:
          - Informational
          - Unusual
          - Suspicious
          - Moderate
          - Malicious
          - High
          - Very Malicious
          - Very High
        evidenceString:
          type: string
          description: Human-readable evidence summary with source references and sighting details.
        mitigationString:
          type: string
          description: Recommended mitigation or remediation guidance for this risk rule.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the evidence was observed.
    RiskData:
      type: object
      description: Risk assessment data with score, triggered rules, and supporting evidence. Included when the fields parameter contains 'risk'. Not available for Malware entities.
      properties:
        score:
          type: integer
          description: Numeric risk score from 0 (no risk) to 99 (critical risk).
          minimum: 0
          maximum: 99
        criticality:
          type: integer
          description: Numeric criticality level (0=None, 1=Informational, 2=Unusual, 3=Suspicious, 4=Malicious).
        criticalityLabel:
          type: string
          description: 'Risk criticality label. IOC entities use: Unusual, Suspicious, Malicious, Very Malicious. Company entities use: Informational, Moderate, High, Very High.'
          enum:
          - None
          - Informational
          - Unusual
          - Suspicious
          - Moderate
          - Malicious
          - High
          - Very Malicious
          - Very High
        riskString:
          type: string
          description: Triggered vs total risk rules (e.g., '16/81').
        rules:
          type: integer
          description: Number of currently triggered risk rules.
        riskSummary:
          type: string
          description: Human-readable risk summary (e.g., '16 of 81 Risk Rules currently observed.').
        evidenceDetails:
          type: array
          description: Evidence for each triggered risk rule.
          items:
            $ref: '#/components/schemas/EvidenceDetail'
    Timestamps:
      type: object
      description: First and last seen timestamps for the entity in Recorded Future data.
      properties:
        firstSeen:
          type: string
          format: date-time
          description: ISO 8601 timestamp of first observation.
        lastSeen:
          type: string
          format: date-time
          description: ISO 8601 timestamp of most recent observation.
    CompanyByDomainResponse:
      type: object
      description: Company entity resolved from a domain name, with risk assessment data.
      properties:
        data:
          type: object
          description: Company entity data resolved from domain lookup.
          properties:
            entity:
              $ref: '#/components/schemas/Entity'
            risk:
              $ref: '#/components/schemas/RiskData'
            curated:
              type: boolean
              description: Whether this company entity has been editorially curated.
            timestamps:
              $ref: '#/components/schemas/Timestamps'
        metadata:
          type: object
          description: Request metadata. Included when the metadata query parameter is set to true.
      required:
      - data
    CompanyLookupResponse:
      type: object
      description: Company enrichment response. Company entities have risk scores but do not support aiInsights or links fields. The response includes only the fields specified in the `fields` query parameter.
      properties:
        data:
          type: object
          description: Company entity data with requested enrichment fields.
          properties:
            entity:
              $ref: '#/components/schemas/Entity'
            risk:
              $ref: '#/components/schemas/RiskData'
            intelCard:
              type: string
              format: uri
              description: URL to the Recorded Future Intelligence Card for this company.
            counts:
              type: array
              description: Daily reference count time-series. Can be very large (97KB+) for well-known companies.
              items:
                type: object
            analystNotes:
              type: array
              description: Insikt Group analyst notes.
              items:
                type: object
            relatedEntities:
              type: array
              description: Co-occurrence relationships (not editorially validated).
              items:
                type: object
            metrics:
              type: array
              description: Flat metric counters.
              items:
                type: object
        metadata:
          type: object
          description: Request metadata. Included when the metadata query parameter is set to true.
      required:
      - data
    ListRiskRulesResponse:
      type: object
      description: Response containing risk rules for an entity type. Each rule includes its API name, description, criticality level, entity count, and framework code associations.
      properties:
        data:
          type: object
          properties:
            results:
              type: array
              description: Array of risk rule objects.
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: API name of the risk rule, used as filter value in Search and Risk List endpoints (e.g., recentSshDictAttacker)
                  description:
                    type: string
                    description: Human-readable description of the risk rule
                  criticalityLabel:
                    type: string
                    description: 'Criticality level label. IOC entities use: Unusual, Suspicious, Malicious, Very Malicious. Company entities use: Informational, Moderate, High, Very High. A value of "0" indicates no risk.'
                    enum:
                    - '0'
                    - Informational
                    - Unusual
                    - Suspicious
                    - Moderate
                    - Malicious
                    - High
                    - Very Malicious
                    - Very High
                  criticality:
                    type: integer
                    description: Numeric criticality (0=No Risk, 1=Informational/Unusual, 2=Moderate/Suspicious, 3=High/Malicious, 4=Very High/Very Malicious). IOC and Company entity types use different label mappings for the same numeric levels.
                  count:
                    type: integer
                    description: Number of entities currently triggering this risk rule
                  categories:
                    type: array
                    description: Associated framework codes (e.g., MITRE ATT&CK techniques for IOC types, NIST/Functional Categories for Company).
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Framework code (e.g., T1595 for MITRE ATT&CK, ID.RA-4 for NIST)
                        framework:
                          type: string
                          description: Framework name (e.g., MITRE, NIST)
                  relatedEntities:
                    type: array
                    description: Related entities associated with this risk rule.
                    items:
                      type: object
          required:
          - results
      required:
      - data
    CountsData:
      type: object
      description: Pagination counts.
      properties:
        returned:
          type: integer
          description: Number of results in this response page
        total:
          type: integer
          description: Total number of matching results across all pages
    BaseSearchResponse:
      type: object
      description: Paginated search results for entities matching the specified filters.
      properties:
        data:
          type: object
          properties:
            results:
              type: array
              description: Array of matching entity objects. Each includes entity identification and enrichment data controlled by the fields parameter.
              items:
                type: object
                properties:
                  entity:
                    type: object
                    description: Entity identification.
                    properties:
                      id:
                        type: string
                        description: Recorded Future entity ID (e.g., ip:8.8.8.8, idn:example.com, hash:abc123)
                      name:
                        type: string
                        description: Entity display name
                      type:
                        type: string
                        description: Entity type classification (e.g., IpAddress, InternetDomainName, Hash, CyberVulnerability, Malware, Company, URL)
                      description:
                        type: string
                        description: Entity description (present for vulnerabilities and some other types).
                  risk:
                    type: object
                    description: Risk assessment data (included when fields contains 'risk').
                    properties:
                      score:
                        type: integer
                        description: Numeric risk score (0-99)
                      criticality:
                        type: integer
                        description: Numeric criticality level (1-4)
                      criticalityLabel:
                        type: string
                        description: 'Risk criticality label. IOC entities use: Unusual, Suspicious, Malicious, Very Malicious. Company entities use: Informational, Moderate, High, Very High.'
                        enum:
                        - Informational
                        - Unusual
                        - Suspicious
                        - Moderate
                        - Malicious
                        - High
                        - Very Malicious
                        - Very High
                      riskString:
                        type: string
                        description: Triggered rules vs total rules (e.g., 16/81)
                      rules:
                        type: integer
                        description: Number of triggered risk rules
                      riskSummary:
                        type: string
                        description: Human-readable risk summary
                      evidenceDetails:
                        type: array
                        description: Evidence for each triggered risk rule.
                        items:
                          type: object
                          properties:
                            rule:
                              type: string
                              description: Risk rule description
                            criticality:
                              type: integer
                              description: Rule criticality level
                            criticalityLabel:
                              type: string
                              description: Rule criticality label
                            evidenceString:
                              type: string
                              description: Human-readable evidence summary
                            timestamp:
                              type: string
                              description: ISO 8601 timestamp of the evidence
                  timestamps:
                    type: object
                    description: First and last seen timestamps for the entity.
                    properties:
                      firstSeen:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp of first observation.
                      lastSeen:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp of most recent observation.
          required:
          - results
        counts:
          $ref: '#/components/schemas/CountsData'
      required:
      - data
      - counts
    SearchResponseWithMetadata:
      description: Paginated search results with optional request metadata.
      allOf:
      - $ref: '#/components/schemas/BaseSearchResponse'
      - type: object
        properties:
          metadata:
            type: object
            description: Request metadata (included when metadata=true).
            properties:
              entries:
                type: array
                description: Metadata entries describing query parameters and their values.
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: Parameter name.
                    label:
                      type: string
                      description: Human-readable label.
                    type:
                      type: string
                      description: Parameter type.
                    item:
                      type: object
                      description: Parameter value details.
    DemoEventsResponse:
      type: string
      description: Plain text syslog entries containing simulated events with entity indicators from the risk list. One log entry per line. Format varies by entity type (e.g., Juniper NetScreen syslog for IP, Squid proxy log for domain).
    ExtensionResponse:
      type: object
      description: Extension data for an entity. The structure varies by extension type (e.g., relatedEntities, metrics, riskyCIDRIPs).
      properties:
        data:
          type: object
          description: Extension-specific data. Structure depends on the extension requested.
        metadata:
          type: object
          description: Request metadata (included when metadata=true).
    AiInsights:
      type: object
      description: AI-generated threat analysis. Included when the fields parameter contains 'aiInsights'. Text is null when fewer than 3 risk rules are triggered.
      properties:
        text:
          type: string
          nullable: true
          description: AI-generated threat analysis paragraph. Null when fewer than 3 risk rules are triggered.
        numberOfReferences:
          type: integer
          description: Number of intelligence references used to generate the insight.
        comment:
          type: string
          nullable: true
          description: Explanatory comment (e.g., why insights are not available).
    LinksEntity:
      type: object
      description: An entity referenced in a validated intelligence link.
      properties:
        id:
          type: string
          description: Recorded Future entity ID.
        name:
          type: string
          description: Entity display name.
        type:
          type: string
          description: Entity type (e.g., MitreAttackIdentifier, Malware, ThreatActor, Company, IpAddress).
    LinksData:
      type: object
      description: Validated intelligence relationships to threat actors, malware, MITRE ATT&CK techniques, and other entities. Included when the fields parameter contains 'links'. Unlike relatedEntities, these are editorially validated relationships.
      properties:
        hits:
          type: array
          description: Intelligence hits containing sectioned relationship data.
          items:
            type: object
            properties:
              start_date:
                type: string
                description: Start date of the intelligence hit time window.
              stop_date:
                type: string
                description: End date of the intelligence hit time window.
              total_count:
                type: integer
                description: Total number of entity relationships in this hit.
              sample_reference_ids:
                type: array
                description: Sample reference IDs supporting this hit.
                items:
                  type: string
              counts:
                type: array
                description: Breakdown counts by entity type.
                items:
                  type: object
                  properties:
                    count:
                      type: integer
                      description: Number of entities.
                    type:
                      type: object
                      description: Entity type metadata.
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
              event_count:
                type: integer
                description: Number of events in this hit.
              sections:
                type: array
                description: Relationship sections grouped by category.
                items:
                  type: object
                  properties:
                    section_id:
                      type: object
                      description: Section identifier.
                      properties:
                        id:
                          type: string
                          description: Section ID.
                        name:
                          type: string
                          description: Section category name (e.g., 'Actors, Tools & TTPs', 'Victims & Exploit Targets', 'Indicators & Detection Rules').
                        type:
                          type: string
                          description: Section type (e.g., 'Category').
                    total_count:
                      type: integer
                      description: Total entities in this section.
                    lists:
                      type: array
                      description: Entity lists within this section, grouped by entity type.
                      items:
                        type: object
                        properties:
                          entities:
                            type: array
                            items:
                              $ref: '#/components/schemas/LinksEntity'
                          total_count:
                            type: integer
                            description: Total entities in this list.
                          type:
                            type: object
                            description: Entity type metadata for this list.
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              type:
                                type: string
                              description:
                                type: string
        method_aggregates:
          type: array
          description: Aggregated counts of linked entities by analysis method.
          items:
            type: object
            properties:
              count:
                type: integer
                description: Number of links found by this method.
              type:
                type: string
                description: Analysis method type.
        counts:
          type: array
          description: Summary counts of linked entities by type.
          items:
            type: object
            properties:
              count:
                type: integer
                description: Number of linked entities of this type.
              type:
                type: object
                description: Entity type metadata.
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                  description:
                    type: string
    Sighting:
      type: object
      description: An intelligence sighting from a specific source.
      properties:
        source:
          type: string
          description: Source name (e.g., 'GitHub', 'PasteBin', 'Turk Hack Team Forum').
        url:
          type: string
          format: uri
          description: URL to the original source.
        published:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the sighting was published.
        fragment:
          type: string
          description: Text fragment from the source mentioning the entity.
        title:
          type: string
          description: Title of the source document.
        type:
          type: string
          description: Sighting category.
          enum:
