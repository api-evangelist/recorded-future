                    type: object
                    properties:
                      id:
                        type: string
                        description: IP entity ID.
                      name:
                        type: string
                        description: IP address string.
                      type:
                        type: string
                        description: Entity type (e.g., 'IpAddress').
            timestamps:
              $ref: '#/components/schemas/Timestamps'
            sightings:
              type: array
              description: Intelligence sightings from various source types. Each item's `type` field indicates the category (recentDarkWeb, recentPaste, recentInfoSec, recentSocialMedia, mostRecent, first). Included when the fields parameter contains 'sightings'.
              items:
                $ref: '#/components/schemas/Sighting'
            threatLists:
              type: array
              description: Curated threat list memberships.
              items:
                $ref: '#/components/schemas/ThreatList'
            riskMapping:
              type: array
              description: Risk rule to MITRE ATT&CK mapping.
              items:
                $ref: '#/components/schemas/RiskMapping'
            analystNotes:
              type: array
              description: Insikt Group analyst notes. Can be very large (67KB+).
              items:
                type: object
            relatedEntities:
              type: array
              description: Co-occurrence relationships (not editorially validated). Can be 19-29KB.
              items:
                type: object
            counts:
              type: array
              description: Daily reference count time-series.
              items:
                type: object
            metrics:
              type: array
              description: Flat metric counters.
              items:
                type: object
        metadata:
          type: object
          description: Request metadata. Included when the metadata query parameter is set to true.
      required:
      - data
