    IpLookupResponse:
      type: object
      description: IP address enrichment response. The response includes only the fields specified in the `fields` query parameter. All properties under `data` are optional because they appear only when requested.
      properties:
        data:
          type: object
          description: IP address entity data with requested enrichment fields.
          properties:
            entity:
              $ref: '#/components/schemas/Entity'
            risk:
              $ref: '#/components/schemas/RiskData'
            aiInsights:
              $ref: '#/components/schemas/AiInsights'
            links:
              $ref: '#/components/schemas/LinksData'
            intelCard:
              type: string
              format: uri
              description: URL to the Recorded Future Intelligence Card for this IP.
            location:
              type: object
              description: Geolocation and network ownership data for the IP address. Included when the fields parameter contains 'location'.
              properties:
                organization:
                  type: string
                  description: Hosting organization or ISP name.
                cidr:
                  type: object
                  description: CIDR block containing this IP.
                  properties:
                    id:
                      type: string
                      description: CIDR entity ID.
                    name:
                      type: string
                      description: CIDR notation (e.g., '64.227.176.0/20').
                    type:
                      type: string
                      description: Entity type.
                location:
                  type: object
                  description: Geographic location.
                  properties:
                    continent:
                      type: string
                    country:
                      type: string
                    city:
                      type: string
                asn:
                  description: Autonomous System Number. May be a simple string (e.g., 'AS14061') or an entity object with id/name/type.
                  oneOf:
                  - type: string
                    description: ASN string (e.g., 'AS14061').
                  - type: object
                    properties:
                      id:
                        type: string
                        description: ASN entity ID (e.g., 'asn:AS14061').
                      name:
                        type: string
                        description: ASN display name (e.g., 'AS14061').
                      type:
                        type: string
                        description: Entity type.
            dnsPortCert:
              type: object
              description: DNS records, open ports, and TLS certificates associated with the IP. Included when the fields parameter contains 'dnsPortCert'.
              properties:
                certificates:
                  type: array
                  description: TLS/SSL certificates observed on this IP.
                  items:
                    type: object
                dns:
                  type: object
                  description: DNS resolution data.
                  properties:
                    forwardDns:
                      type: array
                      description: Domains resolving to this IP.
                      items:
                        type: object
                    reverseDns:
                      type: array
                      description: Reverse DNS (PTR) records for this IP.
                      items:
                        type: object
                ports:
                  type: array
                  description: Open ports observed on this IP.
                  items:
                    type: object
                    properties:
                      port:
                        type: integer
                        description: Port number.
                      protocol:
                        type: string
                        description: Protocol (e.g., 'tcp', 'udp').
                      name:
                        type: string
                        description: Service name (e.g., 'ssh', 'http').
                      product:
                        type: string
                        description: Software product name.
                      version:
                        type: string
                        description: Software version.
                      extraInfo:
                        type: string
                        description: Additional service information.
            scanner:
              type: object
              description: Scanning behavior analysis for the IP. Included when the fields parameter contains 'scanner'.
              properties:
                verdict:
                  type: string
                  description: Scanning verdict (e.g., 'scanner', 'not_scanner').
                lastSeen:
                  type: string
                  format: date-time
                  description: Last observed scanning activity.
                scannerCountry:
                  type: string
                  description: Country of origin for scanning activity.
                scannedIpCountries:
                  type: array
                  description: Countries of IPs targeted by this scanner.
                  items:
                    type: string
                globalScanner:
                  type: boolean
                  description: Whether this IP is classified as a global scanner.
                tags:
                  type: object
                  description: Scanner classification tags.
                  properties:
                    entity:
                      type: array
                      description: Entity-level tags.
                      items:
                        type: object
                rdns:
                  type: array
                  description: Reverse DNS hostnames for this IP.
                  items:
                    type: string
                webRequests:
                  type: array
                  description: Observed web requests made by this scanner.
                  items:
                    type: object
                userAgents:
                  type: array
                  description: User agent strings observed from this scanner.
                  items:
                    type: string
                ports:
                  type: object
                  description: Ports scanned by this IP, grouped by protocol.
                  properties:
                    tcp:
                      type: array
                      items:
                        type: integer
                      description: TCP ports scanned.
                    udp:
                      type: array
                      items:
                        type: integer
                      description: UDP ports scanned.
            riskyCIDRIPs:
