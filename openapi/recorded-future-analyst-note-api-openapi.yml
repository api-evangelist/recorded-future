openapi: 3.1.0
info:
  title: Analyst Note API
  version: 1.0.1
  description: 'A Recorded Future API for creating, fetching, editing and deleting Analyst Notes.


    Please read the [Recorded Future Docs](https://docs.recordedfuture.com/reference/analyst-note) before using this API.

    '
  x-rf-service-id: service:analyst-note
servers:
- url: https://api.recordedfuture.com/analyst-note
paths:
  /attachment/{note_id}:
    get:
      summary: Lookup an attachment of a specific Analyst Note
      tags:
      - Analyst Note
      security:
      - ApiKeyAuth: []
      - idp: []
      parameters:
      - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Binary data of the note attachment
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/BinaryResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Download the binary attachment file associated with an analyst note.
  /delete/{note_id}:
    delete:
      summary: Delete a specific Analyst Note
      tags:
      - Analyst Note
      security:
      - ApiKeyAuth: []
      - idp: []
      parameters:
      - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Status of the delete operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                status: Ok
                report_id: doc:wB0Rhk
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Permanently delete an analyst note owned by your organization.
  /draft:
    post:
      summary: Draft an Analyst Note
      tags:
      - Analyst Note
      description: Create a draft analyst note in the database without publishing it.
      security:
      - ApiKeyAuth: []
      - idp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
            example:
              attributes:
                title: Note title
                text: Note text
                note_entities:
                - source:roLoLW
              source: source:VKz42X
              resolve_entities: true
      responses:
        '200':
          description: Report id of the draft note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
              example:
                report_id: report:V0BVfY
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /export/{format}/{note_id}:
    get:
      summary: Return Analyst Note as pdf or html file
      tags:
      - Analyst Note
      security:
      - ApiKeyAuth: []
      - idp: []
      parameters:
      - $ref: '#/components/parameters/Format'
      - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Binary file data
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/BinaryResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Export an analyst note as a rendered PDF or HTML file.
  /lookup/{note_id}:
    post:
      summary: Lookup a specific Analyst Note
      tags:
      - Analyst Note
      security:
      - ApiKeyAuth: []
      - idp: []
      parameters:
      - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
            example:
              tagged_text: false
              escape_html: false
              serialization: full
      responses:
        '200':
          description: Detailed object of the note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              example:
                attributes:
                  title: Note title
                  text: Note text
                  published: '2024-01-01T13:00:00.000Z'
                  note_entities:
                  - id: B_FDB
                    name: Egypt
                    type: Country
                  topic:
                  - id: h4G-3N
                    name: Geopolitical Validated Event
                    type: Topic
                  validation_urls:
                  - id: url:https://www.egypttoday.com/Article/3/130398/Egypt-s-unemployment-rate-reaches-record-low-of-6-9
                    name: https://www.egypttoday.com/Article/3/130398/Egypt-s-unemployment-rate-reaches-record-low-of-6-9
                    type: URL
                id: doc:vvpzg4
                source:
                  id: source:VKz42X
                  name: Insikt Group
                  type: Source
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Retrieve a specific analyst note by its ID with configurable serialization level.
  /preview:
    post:
      summary: Preview an Analyst Note
      tags:
      - Analyst Note
      description: Preview a rendered analyst note with entity resolution without saving it.
      security:
      - ApiKeyAuth: []
      - idp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
            example:
              attributes:
                title: Note title
                text: Note text
                note_entities:
                - source:roLoLW
              source: source:VKz42X
              tagged_text: false
              escape_html: false
              serialization: full
      responses:
        '200':
          description: Note object as shown if published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
              example:
                attributes:
                  title: Note title
                  text: Note text
                  note_entities:
                  - id: source:roLoLW
                    name: BreachForums 2
                    type: Source
                source:
                  id: source:VKz42X
                  name: Insikt Group
                  type: Source
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /publish:
    post:
      summary: Publish an Analyst Note
      tags:
      - Analyst Note
      description: Publish an analyst note, making it visible to your organization.
      security:
      - ApiKeyAuth: []
      - idp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
            example:
              attributes:
                title: Note title
                text: Note text
                note_entities:
                - source:roLoLW
              source: source:VKz42X
              tagged_text: false
              escape_html: false
              serialization: full
              resolve_entities: true
      responses:
        '200':
          description: Note id of the published note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
              example:
                note_id: doc:vqqO35
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search:
    post:
      summary: Search for Analyst Notes
      tags:
      - Analyst Note
      description: Search published analyst notes from your enterprise and Insikt Group.
      security:
      - ApiKeyAuth: []
      - idp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              published: -2d
              topic: h4G-3N
              limit: 1
              tagged_text: false
              escape_html: false
              serialization: full
      responses:
        '200':
          description: A list of notes matching the search criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                data:
                - attributes:
                    title: Note title
                    text: Note text
                    published: '2024-01-01T13:00:00.000Z'
                    note_entities:
                    - id: B_FDB
                      name: Egypt
                      type: Country
                    topic:
                    - id: h4G-3N
                      name: Geopolitical Validated Event
                      type: Topic
                    validation_urls:
                    - id: url:https://www.egypttoday.com/Article/3/130398/Egypt-s-unemployment-rate-reaches-record-low-of-6-9
                      name: https://www.egypttoday.com/Article/3/130398/Egypt-s-unemployment-rate-reaches-record-low-of-6-9
                      type: URL
                  id: doc:vvpzg4
                  source:
                    id: source:VKz42X
                    name: Insikt Group
                    type: Source
                next_offset: eyJvZmZzZXQiOlsxNzI3MDYzODQ0MjY0LCJIRkFvQUFBQUFRQyJdfQ==
                counts:
                  returned: 1
                  total: 10
components:
  parameters:
    NoteId:
      in: path
      name: note_id
      required: true
      schema:
        type: string
      description: Note id
      example: doc:wB0Rhk
    Format:
      in: path
      name: format
      required: true
      schema:
        type: string
        enum:
        - html
        - pdf
      description: export format
      example: pdf
  schemas:
    DeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: Ok
        report_id:
          type: string
          description: ID of the deleted note
          example: doc:wB0Rhk
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
        status_code:
          type: integer
          description: HTTP status code
        trace_id:
          type: string
          description: Trace ID for debugging
      required:
      - message
      - status_code
      - trace_id
      example:
        message: Not Found
        status_code: 404
        trace_id: 29c09655-6aab-4e17-98a0-d132aa84acdc
    DraftRequest:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/NoteRequestAttributes'
        events:
          $ref: '#/components/schemas/NoteEvents'
        source:
          $ref: '#/components/schemas/SourceId'
        report_id:
          $ref: '#/components/schemas/ReportId'
        resolve_entities:
          $ref: '#/components/schemas/ResolveEntitiesParam'
      required:
      - attributes
      - source
    DraftResponse:
      type: object
      properties:
        report_id:
          type: string
      required:
      - report_id
    NoteEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
      required:
