openapi: 3.0.3
info:
  title: Mastercard Riskrecon API
  version: '1.0'
  description: 'RiskRecon provides organizations with frequent, comprehensive, actionable visibility into the security quality of their business partners.  RiskRecon does this by automatically measuring the security performance of any enterprise across security domains and criteria, providing visibility into security programs.


    All of the security discovery and analytics are based on public information with no inside access required.  The RiskRecon service requires an account with RiskRecon.'
  contact:
    name: API Support
    email: support@riskrecon.com
    url: https://riskrecon.zendesk.com/hc/en-us
servers:
- url: https://api.sandbox.riskrecon.com
  description: Sandbox server
- url: https://api.riskrecon.com
  description: Production server
security:
- bearerAuth: []
paths:
  /v1/action_plan/findings/{toe_id}:
    get:
      tags:
      - Action Plans
      summary: This resource returns a list of finding details from an action plan of a TOE.
      description: This API returns a list of findings for a given action plan of a TOE. The end-user needs to input the TOE ID (toe_id) for a given action plan in the API request.
      operationId: getActionPlanFindings
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage250'
      - $ref: '#/components/parameters/FindingsSortAttribute'
      - $ref: '#/components/parameters/SortMethod'
      - $ref: '#/components/parameters/Severity'
      - $ref: '#/components/parameters/AssetValue'
      - $ref: '#/components/parameters/SecurityDomain'
      - $ref: '#/components/parameters/SecurityCriteria'
      - $ref: '#/components/parameters/CveIds'
      responses:
        '200':
          $ref: '#/components/responses/GetPaginatedFindings'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/action_plan/issue_progress/{toe_id}:
    get:
      tags:
      - Action Plans
      summary: This resource tracks and reports a vendors progress in addressing action plan issues.
      description: RiskRecon automatically reports each vendor’s progress in addressing their action plan issues. This API returns issue progress for a given action plan.
      operationId: actionPlanIssueProgress
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/ActionPlanIssueProgress'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/action_plan/issue_summary/{toe_id}:
    get:
      tags:
      - Action Plans
      summary: This resource returns a vendor's action plan issue summary.
      description: This API returns a list of issue summaries for a given action plan. There are no parameters for this use case. The end-user needs to input the TOE ID (toe_id) for a given action plan in the API request.
      operationId: getActionPlanIssueSummary
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetActionPlanIssueSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/action_plan/priority_matrix_counts/{toe_id}:
    get:
      tags:
      - Action Plans
      summary: This API returns the count of current action plan issues per their severity and priority.
      description: 'This API returns the counts of action plans as per their severity and priority. Found issues are assigned a Priority and Severity index. The end-user needs to input the TOE ID (toe_id) for a given action plan in the API request.


        In this scenario, the following are returned in the response:

        * the asset value starting from 1 to 4, where 1 = Idle, 2 = Low, 3 = Medium, 4 = High

        * total count of issues for each asset value

        * total count of issues by severity. The severity values can be Low, Medium, High, and Critical.

        '
      operationId: getActionPlanPriorityMatrix
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetActionPlanPriorityMatrixResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/action_plan/vendor_status_summary_counts/{toe_id}:
    get:
      tags:
      - Action Plans
      summary: This API returns the vendor status summary counts of a given action plan.
      description: 'This API returns the vendor status summary counts of a given action plan. The end-user needs to input the TOE ID (toe_id) for a given action plan in the API request.


        In this scenario, the following are returned in the response:


        * total action plans provided to the vendor

        * the label of the action plans

        * the status of the action plans

        '
      operationId: getActionPlanVendorStatusSummaryCounts
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetActionPlanVendorStatusSummaryCounts'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/action_plan/{toe_id}:
    get:
      tags:
      - Action Plans
      summary: This resource returns action plan configurations both automated and manual for a given TOE.
      description: This API returns action plan configurations both automated and manual for a given TOE. The end-user needs to input the TOE ID (toe_id) for a given action plan in the API request.
      operationId: getActionPlanConfig
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetActionPlanConfigResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
    post:
      tags:
      - Action Plans
      summary: This resource sends action plan email to recipients of a TOE.
      description: 'This API sends action plan findings to internal and external recipients. The end-user needs to input the TOE ID (toe_id) for a given action plan in the API request.


        Recipients and frequency are optional. If recipients are not provided, the action plan will be shared with previously shared recipients. If frequency is not provided, the action plan will be shared manually.


        Users can retrieve action plan configuration from ```(GET) /v1/action_plan/{toe_id} ``` API.

        * recipients: An Array of first_name, last_name, email, internal (true/false) for each recipient. See schema for more details.

        * frequency:  0 (default) is for manual/one-off, where 30/60/90 sets periodic automated action plan emails.'
      operationId: shareActionPlan
      parameters:
      - $ref: '#/components/parameters/ToeId'
      requestBody:
        $ref: '#/components/requestBodies/ShareActionPlanRequest'
      responses:
        '201':
          $ref: '#/components/responses/AddShareActionPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
  /v1/alerting/issues:
    get:
      tags:
      - Alerts
      summary: This resource returns Alerting Issues from new scans in their portfolio based on the users alert settings.
      description: This resource returns Alerting Issues from new scans in their portfolio based on the users alert settings.  Alert settings can be changed at https://portal.riskrecon.com/portal/alert-center/alert-settings.
      operationId: getAlertingNewIssues
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/SortMethod'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/Priorities'
      - $ref: '#/components/parameters/AlertingIssuesSortAttribute'
      responses:
        '200':
          $ref: '#/components/responses/GetAlertingNewIssues'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/alerting/rating_changes:
    get:
      tags:
      - Alerts
      summary: This resource returns any rating/score changes from new scans in the users portfolio based on the users alert settings.
      description: This resource returns any rating/score changes from new scans in the users portfolio based on the users alert settings. Alert settings can be changed at https://portal.riskrecon.com/portal/alert-center/alert-settings.
      operationId: getAlertingScoreChanges
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/SortMethod'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/AlertTypes'
      - $ref: '#/components/parameters/AlertingScoreChangesSortAttribute'
      responses:
        '200':
          $ref: '#/components/responses/GetAlertingScoreChanges'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/analysis/current/{toe_id}:
    get:
      tags:
      - Analyses
      summary: ':: Legacy Route Please use getToeRatings :: This resource returns the most recent `Analysis` object by the TOE identifier. Trend data is only included if `include_trend` query param is added.'
      description: ':: Legacy Route Please use getToeRatings :: This resource returns the most recent `Analysis` object by the TOE identifier. This includes the security domain and criteria ratings. Trend data is only included if `include_trend` query param is added.'
      operationId: getAnalysisRatings
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/IncludeTrend'
      responses:
        '200':
          $ref: '#/components/responses/GetAnalysisRatingsResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/analysis/history/{toe_id}:
    get:
      tags:
      - Analyses
      summary: ':: Legacy Route Please use getToeRatings :: This resource returns a collection of historical `Analysis` objects by the TOE identifier.'
      description: ':: Legacy Route Please use getTOERatings :: This resource returns a collection of historical `Analysis` objects by the TOE identifier. This includes the security domain and criteria ratings for each analysis.'
      operationId: getHistoricalAnalysisRatings
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetHistoricalAnalysisRatingsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/compliance/controls/{toe_id}:
    get:
      tags:
      - Compliance
      summary: This resource returns risk standard controls associated with a TOE id and a particular custom or industry standard.
      description: This resource returns risk standard controls associated with a TOE id and a particular custom or industry standard.  The risk standard id can be obtained from the /v1/compliance/{toe_id} response. Some will be mapped to RiskRecon security domain and criteria so will include the ratings for these domain/criteria and the TOE being queried.
      operationId: getRiskStandardsControls
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/RiskStandardId'
      responses:
        '200':
          $ref: '#/components/responses/GetRiskStandardsControlsResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/compliance/{toe_id}:
    get:
      tags:
      - Compliance
      summary: This resource returns an list of custom and industry standards.
      description: This resource returns an list of custom and industry standards. Each standard has a number of controls.  Some of these will be mapped to RiskRecon security domain and criteria and will have the associated ratings.
      operationId: getRiskStandards
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/RiskDimension'
      responses:
        '200':
          $ref: '#/components/responses/GetRiskStandards'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/data_loss_events/{toe_id}:
    get:
      tags:
      - Data Loss Events
      summary: ':: Legacy Route :: This resource returns a collection of `DataLossEvent` objects.'
      description: '"::Legacy Route please use portfolio_data_loss_events:: This resource returns a collection of `DataLossEvent` objects for a given TOE id. This are referred to as Breach Events in the RiskRecon site."'
      operationId: getDataLossEvents
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetDataLossEventsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/display_names/security_criteria:
    get:
      tags:
      - Display Name
      summary: This resource returns a mapping of security_criteria labels and their current display names in the RiskRecon portal.
      description: This resource returns a mapping of security_criteria labels and their current display names in the RiskRecon portal.  It also includes if the security_criteria is currently rated and if it is deprecated.
      operationId: getCriteriaDisplayNames
      parameters:
      - $ref: '#/components/parameters/RiskDimensions'
      responses:
        '200':
          $ref: '#/components/responses/GetDisplayNameResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
  /v1/display_names/security_domain:
    get:
      tags:
      - Display Name
      summary: This resource returns a mapping of security_domain labels and their current display names in the RiskRecon portal.
      description: This resource returns a mapping of security_domain labels and their current display names in the RiskRecon portal.  It also includes if the security_domain is currently rated and if it is deprecated.
      operationId: getDomainDisplayNames
      parameters:
      - $ref: '#/components/parameters/RiskDimensions'
      responses:
        '200':
          $ref: '#/components/responses/GetDisplayNameResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
  /v1/findings/{toe_id}:
    get:
      tags:
      - Findings
      summary: ':: Legacy Route :: This resource returns a list of findings for latest analysis for a given TOE.'
      description: '::Legacy Route please use findings_paginated:: This use case describes how the Findings API is used to retrieve a list of findings for the latest analysis for a TOE. The toe_id is passed in the API request. In this scenario, all findings for that TOE are returned in the response.

        To limit or filter the data returned in the response, you can use various parameters in the API request:

        * Filter by an asset value: You can use the asset_value parameter to search for findings with high, medium, or low asset value.

        * Filter by severity: You can use the severity parameter to search for findings with high, medium, or low severity.

        * Filter by asset value and severity: You can use asset_value and severity parameters to search for findings with high, medium, or low asset value and severity.

        * Filter by multiple asset values: You can use the asset_value parameter multiple times to search for findings with multiple asset values.'
      operationId: getFindings
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/RiskPolicy'
      - $ref: '#/components/parameters/SecurityDomain'
      - $ref: '#/components/parameters/SecurityCriteria'
      - $ref: '#/components/parameters/AssetValues'
      - $ref: '#/components/parameters/NumericAssetValues'
      - $ref: '#/components/parameters/Priority'
      - $ref: '#/components/parameters/Severities'
      responses:
        '200':
          $ref: '#/components/responses/GetFindingResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/findings_paginated/{toe_id}:
    get:
      tags:
      - Findings
      summary: This resource returns a list of findings for latest analysis for a given TOE.
      description: 'This use case describes how the Findings API is used to retrieve a list of findings for the latest analysis for a TOE. The toe_id is passed in the API request. In this scenario, all findings for that TOE are returned in the response.

        To limit or filter the data returned in the response, you can use various parameters in the API request:

        * Filter by an asset value: You can use the asset_value parameter to search for findings with high, medium, or low asset value.

        * Filter by severity: You can use the severity parameter to search for findings with high, medium, or low severity.

        * Filter by asset value and severity: You can use asset_value and severity parameters to search for findings with high, medium, or low asset value and severity.

        * Filter by page: You can use the page parameter to search for findings pages.

        * Sort by Findings Attribute: You can use the sort attribute to sort results of alerting issues by available sort attributes.'
      operationId: getPaginatedFindings
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage250'
      - $ref: '#/components/parameters/FindingsSortAttribute'
      - $ref: '#/components/parameters/SortMethod'
      - $ref: '#/components/parameters/Severity'
      - $ref: '#/components/parameters/AssetValue'
      - $ref: '#/components/parameters/SecurityDomain'
      - $ref: '#/components/parameters/SecurityCriteria'
      - $ref: '#/components/parameters/CveIds'
      - $ref: '#/components/parameters/RiskDimension'
      responses:
        '200':
          $ref: '#/components/responses/GetPaginatedFindings'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/hosts/{toe_id}:
    get:
      tags:
      - Hosts
      summary: This resource returns a list of Hosts for latest analysis for a given TOE.
      description: This resource returns a list of Hosts for latest analysis for a given TOE. This includes domain and netblock information as well.
      operationId: getHosts
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetHostsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/integration/routes/{toe_id}:
    get:
      tags:
      - Integration Routes
      summary: The Integration Routes API provides a list of URLs for the security domains within the Security Profile section of the RiskRecon Portal.
      description: 'The Integration Routes API provides a list of URLs for the security domains within the Security Profile section of the RiskRecon Portal.

        If one of the URLs is followed by an unauthenticated user, they will be prompted to authenticate before they are redirected to the requested URL.

        The only parameter for this API is the TOE ID, which is required.'
      operationId: getIntegrationRoutes
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetIntegrationRoutes'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/integration/routes/{toe_id}/details:
    get:
      tags:
      - Integration Routes
      summary: The Integration Routes Details API provides a list of URLs for the detailed views within each security domain in the Security Profile and its corresponding risk_dimensions section of the RiskRecon Portal.
      description: 'The Integration Routes Details API provides a list of URLs for the detailed views within each security domain in the Security Profile and its corresponding risk_dimensions section of the RiskRecon Portal.

        API will also check if the customer has access and subscription enabled for requested risk dimensions and toes.

        The only parameter for this API is the TOE ID, which is required.'
      operationId: getIntegrationRoutesDetails
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/RiskDimensions'
      responses:
        '200':
          $ref: '#/components/responses/GetIntegrationRoutesDetails'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/portfolio/bulk_add:
    post:
      tags:
      - Portfolio
      summary: This endpoint is for requesting to add new TOEs (targets of evaluation) to your portfolio.
      description: 'This is a bulk request for requesting to add new TOEs (targets of evaluation) to your portfolio.

        The request must have at least one item but no more than 25 per request.'
      operationId: bulkToeRequest
      requestBody:
        $ref: '#/components/requestBodies/CreateToeRequest'
      responses:
        '200':
          $ref: '#/components/responses/SubmittedResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/portfolio/risk_relationships_folders:
    get:
      tags:
      - Portfolio
      summary: This resource gets the customer's risk relationship folders names and slugs.
      description: 'This resource gets the customer''s risk relationship folders names and slugs.

        The slug will be used in requests that require the risk relationship. Risk relationships can be updated here https://portal.riskrecon.com/portal/risk-configuration if you have necessary permissions.'
      operationId: getRiskRelationshipsFolders
      responses:
        '200':
          $ref: '#/components/responses/GetRiskRelationshipsFoldersResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/portfolio/subscription_level_config:
    get:
      tags:
      - Portfolio
      summary: This resource returns the default subscription_level for bulk toe requests for your customer.
      description: 'This resource returns the default subscription_level for bulk toe requests for your customer if it has been set.


        This can be set if you want all /v1/portfolio/bulk_add requests to have the same subscription level.


        Options are 1 (Discover) or 2 (Advisor)'
      operationId: getSubscriptionLevelConfig
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionLevelConfigResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
    put:
      tags:
      - Portfolio
      summary: This resource sets the default subscription_level for bulk toe requests for your customer.
      description: 'This resource sets the default subscription_level for bulk toe requests for your customer if it has been set.


        This can be set if you want all /v1/portfolio/bulk_add requests to have the same subscription level.


        Options are 1 (Discover) or 2 (Advisor)'
      operationId: setSubscriptionLevelConfig
      requestBody:
        $ref: '#/components/requestBodies/UpdateSubscriptionLevelConfig'
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionLevelConfigResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/portfolio_data_loss_events:
    get:
      tags:
      - Data Loss Events
      summary: This resource returns a collection of `BreachEvent` objects.
      description: This resource returns a collection of `DataLossEvent` objects for a portfolio. This is for the entire portfolio and has pagination unlike the data_loss_events route.
      operationId: getBreachEvents
      parameters:
      - $ref: '#/components/parameters/BreachEventsSortAttribute'
      - $ref: '#/components/parameters/BreachEventDateStart'
      - $ref: '#/components/parameters/ToeIdQuery'
      - $ref: '#/components/parameters/CreatedAtStart'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/PublicEventDateStart'
      - $ref: '#/components/parameters/RiskRelationshipSlugs'
      - $ref: '#/components/parameters/SortMethod'
      responses:
        '200':
          $ref: '#/components/responses/GetBreachEvents'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/privacy/portfolio_enforcement_actions:
    get:
      tags:
      - Privacy
      summary: This resource returns a collection of `EnforcementAction` objects.
      description: This resource returns a collection of `EnforcementAction` in portfolio.
      operationId: getEnforcementActions
      parameters:
      - $ref: '#/components/parameters/EnforcementActionsSortAttribute'
      - $ref: '#/components/parameters/EnforcementActionStartDate'
      - $ref: '#/components/parameters/ToeIdQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/RiskRelationshipSlugs'
      - $ref: '#/components/parameters/SortMethod'
      responses:
        '200':
          $ref: '#/components/responses/GetEnforcementActions'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
  /v1/reports/portfolio_ratings:
    get:
      summary: Get portfolio ratings report
      description: Retrieves a paginated list of portfolio ratings with their changes over time
      tags:
      - Reports
      operationId: getPaginatedPortfolioRatingsReport
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage250'
      - $ref: '#/components/parameters/PortfolioRatingReportSortAttribute'
      - $ref: '#/components/parameters/SortMethod'
      - $ref: '#/components/parameters/DaysAgo'
      responses:
        '200':
          $ref: '#/components/responses/GetPaginatedPortfolioRatingsReport'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/subsidiaries/toe_id/{toe_id}:
    get:
      tags:
      - Subsidiaries
      summary: This route returns a collection of `Subsidiary` objects associated with a toe.
      description: 'This route returns a collection of `Subsidiary` objects associated with a toe.

        Any TOEs that appear to be a subsidiary of the provided TOE id are returned in the response.'
      operationId: getSubsidiariesByToeId
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetSubsidiariesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/toe/{toe_id}:
    post:
      tags:
      - Target Of Evaluation TOE
      summary: This endpoint adds an existing TOE to the users portfolio.
      description: 'This endpoint adds an existing TOE to the users portfolio.

        The toe_id and other information can be obtained from the /v1/toes/by_domains response.'
      operationId: addCompanyToToeByToeId
      parameters:
      - $ref: '#/components/parameters/ToeId'
      requestBody:
        $ref: '#/components/requestBodies/AddCompanyToPortfolioRequest'
      responses:
        '201':
          $ref: '#/components/responses/AddExistingToeResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
    delete:
      tags:
      - Target Of Evaluation TOE
      summary: This endpoint deletes an existing TOE to the users portfolio.
      description: User can delete a TOE from their portfolio by providing the toe_id in endpoint.
      operationId: deleteToeByToeId
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/EmptyArrayResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
    get:
      tags:
      - Target Of Evaluation TOE
      summary: This resource gets a `TOE` object by its identifier.
      description: 'This resource gets a `TOE` object by its identifier.

        This include overall ratings and some domain rating information for the current analysis of the provided TOE id.'
      operationId: getToesByToeId
      parameters:
      - $ref: '#/components/parameters/ToeId'
      responses:
        '200':
          $ref: '#/components/responses/GetToeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
    put:
      tags:
      - Target Of Evaluation TOE
      summary: This endpoint allows a user to update the internal_ids and/or internal_name of an existing `TOE` by its identifier.
      description: 'This endpoint allows a user to update the internal_ids and/or internal_name of an existing `TOE` by its identifier.

        These can be used to map a TOE in the RiskRecon system to an entity in the users system.'
      operationId: updateToesByToeId
      parameters:
      - $ref: '#/components/parameters/ToeId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateToeRequest'
      responses:
        '200':
          $ref: '#/components/responses/UpdatedToeResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/toe_reports:
    post:
      tags:
      - TOE Reports
      summary: This resource allows the ordering and downloading of toe reports
      description: "This endpoint provides the ordering of the following toe reports:\n  - Executive Report - The Executive Report (executive-report) provides an executive summary  of the RiskRecon ratings and security performance metrics.\n  - Summary Report - The RiskRecon Summary Report (summary-report) provides the summary  RiskRecon ratings and security performance metrics.\n  - Detailed Report - The RiskRecon Detailed Report (detailed-report) provides the RiskRecon  ratings, security performance metrics, and detailed findings and recommendations.\n  - Action Plan - The action plan (action-plan) on this toe."
      operationId: requestPdfReport
      requestBody:
        $ref: '#/components/requestBodies/OrderToeReportRequest'
      responses:
        '200':
          $ref: '#/components/responses/ToeReportOrderedResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
    get:
      tags:
      - TOE Reports
      summary: This resource returns the list of active report request.
      description: This resource returns all report requests submitted in the last 24 hours by the client.
      operationId: requestPdfReportStatus
      responses:
        '200':
          $ref: '#/components/responses/ActiveToeReportOrders'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/toe_reports/{request_id}:
    get:
      tags:
      - TOE Reports
      summary: This resource returns the PDF report.
      description: This resource gets the PDF report.
      operationId: downloadPdfReport
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/PdfReportResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/toes:
    get:
      tags:
      - Target Of Evaluation TOE
      summary: This resource returns a collection of `TOE` objects mapped to a customer.
      description: 'This API retrieves a collection of TOE objects mapped to a customer.

        This include overall ratings and some domain rating information for the current analysis of the provided TOE id.

        As a TOE can have multiple internal IDs, this API filters if the internal ID is one among the multiple internal IDs.'
      operationId: getToes
      parameters:
      - $ref: '#/components/parameters/InternalId'
      - $ref: '#/components/parameters/LastRetrieved'
      responses:
        '200':
          $ref: '#/components/responses/GetToesResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/toes/by_cve:
    get:
      tags:
      - Target Of Evaluation TOE
      summary: This endpoint allows the user to search for Company name, TOE ID by a valid CVE.
      description: 'This endpoint allows the user to search for Company name, TOE ID by a valid CVE.

        The user must provide a valid cve in query param.'
      operationId: getToeByCve
      parameters:
      - $ref: '#/components/parameters/CveId'
      responses:
        '200':
          $ref: '#/components/responses/GetCveSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/toes/by_domains:
    get:
      tags:
      - Target Of Evaluation TOE
      summary: This endpoint allows the user to search for a TOE by a valid domain or hostname.
      description: 'This endpoint allows the user to search for a TOE by a valid domain or hostname.

        The user must provide a valid domain or hostname in domain query param.'
      operationId: getToeByDomain
      parameters:
      - $ref: '#/components/parameters/Domain'
      responses:
        '200':
          $ref: '#/components/responses/GetToeSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/toes/risk_relationships:
    put:
      tags:
      - Target Of Evaluation TOE
      summary: This endpoint moves an existing TOE from one risk relationship folder to another
      description: User can move a TOE from one risk relationship folder to another by providing the toe_id and relationship folder slug in request. Relationship folder slug can be retrieved from [/v1/portfolio/risk_relationships_folders](#/Portfolio/getRiskRelationshipsFolders).
      operationId: moveToeRequest
      requestBody:
        $ref: '#/components/requestBodies/MoveToeRequest'
      responses:
        '200':
          $ref: '#/components/responses/MoveToeResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityResponse'
  /v1/toes/{toe_id}/ratings:
    get:
      tags:
      - Target Of Evaluation TOE
      summary: Get the current or historical overall, domain and criteria ratings for a given TOE and a given risk dimension.
      description: Get the current or historical overall, domain and criteria ratings for a given TOE and a given risk dimension. Privacy can only be returned if privacy is enabled for your customer and you have a privacy license for the given TOE.
      operationId: getToeRatings
      parameters:
      - $ref: '#/components/parameters/ToeId'
      - $ref: '#/components/parameters/RiskDimensions'
      - $ref: '#/components/parameters/CurrentRatingOnly'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage250'
      responses:
        '200':
          $ref: '#/components/responses/GetToeRatingsResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
  /v1/toes/{toe_id}/subscriptions:
    post:
      tags:
      - Portfolio
      summary: This endpoint adds and updates subscription licenses for a TOE.
      description: This request sets the list of subscription licenses that determine whether a TOE appears in your portfolio, and for which risk dimensions. The currently available Risk Dimensions are CYBER and PRIVACY. The available license types are AVISOR, DISCOVER, and SNAPSHOT. A cyber license of ADVISOR or DISCOVER is a prerequisite of any privacy license. SNAPSHOT licenses are not available for the privacy risk dimension at this time.
      operationId: changeSubscription
      parameters:
      - $ref: '#/components/parameters/ToeId'
      requestBody:
        $ref: '#/components/requestBodies/ChangeSubscriptionRequest'
      responses:
        '201':
          $ref: '#/components/responses/ChangeSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  /v1/toes_paginated:
    get:
      tags:
      - Target Of Evaluation TOE
      summary: This resource returns a collection of `TOE` objects mapped to a customer.
      description: 'This API retrieves a collection of TOE objects mapped to a customer.

        This include overall ratings and some domain rating information for the current analysis of the provided TOE id.

        As a TOE can have multiple internal IDs, this API filters if the internal ID is one among the multiple internal IDs.'
      operationId: getPaginatedToes
      parameters:
      - $ref: '#/components/parameters/InternalId'
      - $ref: '#/components/parameters/LastRetrieved'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage250'
      - $ref: '#/components/parameters/RiskDimensions'
      - $ref: '#/components/parameters/SortMethod'
      - $ref: '#/components/parameters/ToeIdQuery'
      - $ref: '#/components/parameters/ToeSortAttribute'
      responses:
        '200':
          $ref: '#/components/responses/GetPaginatedToes'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
  /v1/user_mgmt:
    get:
      tags:
      - Users
      summary: The User route is used to get all the user data for one’s organization.
      description: 'The User route is used to get all the user data for one’s organization.

        There currently are no filters or params.'
      operationId: getUserData
      responses:
        '200':
          $ref: '#/components/responses/GetUserMgmtResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
components:
  parameters:
    ToeId:
      name: toe_id
      in: path
      description: Filter by the Toe ID.
      required: true
      schema:
        type: string
        example: 5976423a-ee35-11e3-8569-14109ff1a304
    AssetValue:
      in: query
      name: asset_value
      description: This parameter filters finding results by asset_value.
      example: high
      required: false
      schema:
        enum:
        - high
        - medium
        - low
        - idle
        - key
        type: string
    CveIds:
      name: cve_ids[]
      in: query
      description: 'This parameter filters finding results by array of Common Vulnerabilities and Exposures (CVE). An example of a query string with multiple cves would look like:


        ?cve_ids[]=CVE-1999-0001&cve_ids[]=CVE-1999-0002'
      style: form
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
          example: CVE-1999-0001
    FindingsSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of alerting issues by available sort attributes.
      required: false
      schema:
        type: string
        default: priority
        example: priority
        enum:
        - days_open
        - security_criteria
        - asset_value
        - severity
        - priority
    Page:
      name: page
      in: query
      description: This parameter is the page number in routes that have pagination.
      required: false
      schema:
        type: integer
        example: 1
        default: 1
        minimum: 1
    PerPage250:
      name: per_page
      in: query
      description: This parameter sets the results limit per page.  This defaults to 20 and currently has a max of 250.
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        example: 20
        maximum: 250
    SecurityDomain:
      name: security_domain
      in: query
      description: Filter results by the Security Domain.
      schema:
        type: string
        example: software_patching
    SecurityCriteria:
      name: security_criteria
      in: query
      description: Filter results by the Security Criteria.
      schema:
        type: string
        example: patching_app_server
    Severity:
      in: query
      name: severity
      description: Filter finding results by severity.
      required: false
      schema:
        enum:
        - critical
        - high
        - medium
        - low
        type: string
        example: high
    SortMethod:
      name: sort_method
      in: query
      description: Sort results by ascending or descending order.
      required: false
      schema:
        type: string
        default: DESC
        example: DESC
        enum:
        - ASC
        - DESC
    AlertingIssuesSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of alerting issues by available sort attributes.
      required: false
      schema:
        type: string
        default: last_seen
        example: last_seen
        enum:
        - priority
        - last_seen
        - security_criteria
    EndDate:
      in: query
      name: end_date
      description: This parameter filters results before the provided date string in format YYYY-MM-DD. Defaults to current date.  Must be after start_date.
      example: '2023-01-03'
      style: form
      explode: true
      schema:
        type: string
        format: date
    PerPage:
      name: per_page
      in: query
      description: This parameter sets the results limit per page.  This defaults to 20 and currently has a max of 50.
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        example: 20
        maximum: 50
    Priorities:
      in: query
      name: priorities[]
      description: Filter findings based on  priority. Priority is based on asset_value and severity.
      example:
      - 5
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          example: 5
          minimum: 1
          maximum: 6
    StartDate:
      in: query
      name: start_date
      description: Filter results after the provided date string in format YYYY-MM-DD. Can't search back further than 1 month.
      example: '2023-01-03'
      style: form
      explode: true
      schema:
        type: string
        format: date
    AlertingScoreChangesSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of alerting issues by available sort attributes.
      required: false
      schema:
        type: string
        default: date
        example: date
        enum:
        - company
        - security_domain
        - previous_rating
        - new_rating
        - rating_change
        - date
    AlertTypes:
      in: query
      name: alert_types[]
      description: type of score change alert This parameter is optional but allows the user to filter results by available alert_types.
      example:
      - rating_improved
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: rating_improved
          enum:
          - rating_improved
          - low_threshold
          - high_threshold
          - rating_dropped
    IncludeTrend:
      name: include_trend
      in: query
      example: true
      description: This parameter gives the option to include trending data for current analysis request.  Normally, this is only included when looking at the historical analyses.
      schema:
        type: boolean
    RiskDimension:
      name: risk_dimension
      in: query
      description: This parameter filters results by RiskDimension. The default value is cyber. privacy is a new option for customers with privacy licenses.
      schema:
        type: string
        example: cyber
        default: cyber
        enum:
        - cyber
        - privacy
    RiskStandardId:
      name: risk_standard_id
      in: query
      description: Filter by the risk standard id.
      required: true
      schema:
        type: integer
        example: 12345
    BreachEventDateStart:
      in: query
      name: breach_event_start_date
      description: Filter results after the provided date string in format YYYY-MM-DD.
      example: '2023-01-03'
      style: form
      explode: true
      schema:
        type: string
        format: date
    BreachEventsSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of breach events by available sort attributes.
      required: false
      schema:
        type: string
        default: public_event_date
        example: public_event_date
        enum:
        - breach_event_date
        - public_event_date
        - created_at
    CreatedAtStart:
      in: query
      name: created_at_start_date
      description: Filter results after the provided date string in format YYYY-MM-DD.
      example: '2023-01-03'
      style: form
      explode: true
      schema:
        type: string
        format: date
    PublicEventDateStart:
      in: query
      name: public_event_start_date
      description: Filter results after the provided date string in format YYYY-MM-DD.
      example: '2023-01-03'
      style: form
      explode: true
      schema:
        type: string
        format: date
    RiskRelationshipSlugs:
      in: query
      name: risk_relationship_slugs[]
      description: filter results based on customer risk_relationship_slugs, which are returned from /v1/portfolio/risk_relationships_folders. This is optional.
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: ownenterprise_critical
    ToeIdQuery:
      name: toe_id
      in: query
      description: Filter by the Toe ID.
      required: false
      schema:
        type: string
        example: 5976423a-ee35-11e3-8569-14109ff1a304
    RiskDimensions:
      name: risk_dimensions[]
      in: query
      description: 'This parameter filters results by array of RiskDimensions. Defaults to cyber. privacy is a new option for customers with privacy licenses.

        ?risk_dimensions[]=privacy&risk_dimensions[]=cyber'
      style: form
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
          example: cyber
          default: cyber
          enum:
          - cyber
          - privacy
    AssetValues:
      name: asset_value[]
      in: query
      description: 'This parameter filters finding results by asset_values. An example of a query string with multiple asset_values would look like:


        ?asset_value[]=high&asset_value[]=low'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: high
    NumericAssetValues:
      name: asset_value_numeric[]
      in: query
      description: Filter results by asset_value_numeric. An example of a query string with multiple asset_value_numeric values would look like ?asset_value_numeric[]=1&asset_value_numeric[]=3
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: '1'
    Priority:
      name: priority[]
      in: query
      description: Filter results by priority. An example of a query string with multiple priority values would look like ?priority[]=1&priority[]=3.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          example: 1
          minimum: 1
          maximum: 6
    RiskPolicy:
      name: risk_policy
      in: query
      description: Filter findings based on customer risk policy.  This can be setup at https://portal.riskrecon.com/portal/risk-policy.
      schema:
        type: boolean
        example: true
    Severities:
      name: severity[]
      in: query
      description: Filter results by severity. An example of a query string with multiple severities would look like ?severity[]=low&severity[]=medium&severity[]=high.
      style: form
      explode: true
      schema:
        type: array
        items:
          example: high
          type: string
          enum:
          - critical
          - high
          - medium
          - low
    EnforcementActionsSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of enforcement actions by available sort attributes.
      required: false
      schema:
        type: string
        default: enforcement_action_date
        example: enforcement_action_date
        enum:
        - enforcement_action_date
    EnforcementActionStartDate:
      in: query
      name: enforcement_action_start_date
      description: This parameter filters enforcement actions starting from the provided date string in format YYYY-MM-DD.
      example: '2023-01-01'
      style: form
      explode: true
      schema:
        type: string
        format: date
    DaysAgo:
      name: days_ago
      in: query
      description: This parameter filters results by the number of days ago.  This is optional but allows the user to filter results by the number of days ago.
      required: false
      schema:
        type: integer
        example: 360
        default: 360
    PortfolioRatingReportSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of portfolio ratings by available sort attributes.
      required: false
      schema:
        type: string
        default: rating_change
        example: rating_change
        enum:
        - start_date
        - end_date
        - vendor_name
        - folder
        - criticality
        - start_rating
        - end_rating
        - rating_change
    InternalId:
      name: internal_id[]
      in: query
      description: This parameter filters results by internal_id. A TOE can actually have multiple internal_ids so it will filter if the given internal_id is one of them (if there are multiple).
      style: form
      explode: true
      schema:
        type: array
        items:
          example: '12345'
          type: string
    LastRetrieved:
      name: last_retrieved
      in: query
      description: Filter results published or updated after the provided date string in format YYYY-MM-DD.  An example request would like like ?last_retrieved=2020-11-20 and this would grab results updated on or after 2020-11-20.
      style: form
      explode: true
      schema:
        type: string
        example: '2020-11-20'
    ToeSortAttribute:
      name: sort_attribute
      in: query
      description: This parameter is optional but allows the user to sort results of paginated TOEs by available sort attributes.
      required: false
      schema:
        type: string
        example: toe_short_name
        enum:
        - toe_short_name
        - date_updated
    CveId:
      name: cve_id
      in: query
      description: 'This parameter filters finding results by single Common Vulnerabilities and Exposures (CVE). For example:


        ?cve_id=CVE-1999-0001'
      required: true
      schema:
        type: string
        example: CVE-1999-0001
    Domain:
      in: query
      name: domain
      description: Search TOEs by domain or hostname. This must be a valid domain or hostname.
      required: true
      schema:
        type: string
        example: riskrecon.com
    CurrentRatingOnly:
      name: current_rating_only
      in: query
      example: true
      description: Option to return only the current most recent rating. Pretty much another way to set per_page to 1.
      schema:
        type: boolean
    RequestId:
      name: request_id
      in: path
      description: This parameter is the report request ID.
      required: true
