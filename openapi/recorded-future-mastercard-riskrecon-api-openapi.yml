  schemas:
    ArrayOfActionPlanIssueProgress:
      title: ArrayOfActionPlanIssueProgress
      type: array
      description: A collection of ActionPlanIssueProgress objects.
      items:
        $ref: '#/components/schemas/ActionPlanIssueProgress'
    ActionPlanIssueProgress:
      type: object
      properties:
        current_action_plan_issues_count:
          type: number
          description: The current issue count for an action plan.
          example: 5
        current_shared_issues_count:
          type: number
          description: The current shared issue count for an action plan.
          example: 5
        event_name:
          type: string
          description: The event description.
          example: AnalysisPublishedToCustomers
        occurred_on:
          type: string
          description: The date associated with issue counts.
          example: '2021-10-01T22:18:57+00:00'
        total_resolved_issues_count:
          type: number
          description: The total resolved issue count for an action plan.
          example: 5
        total_shared_issues_count:
          type: number
          description: The total shared issue count for an action plan.
          example: 5
      description: Action Plan Issue Progress items.
    Error:
      type: object
      description: Error Object
      properties:
        Source:
          description: The application or component that generated this error.
          example: RISKRECON_API
          type: string
          minLength: 0
          maxLength: 200
        ReasonCode:
          description: Reason code is a unique constant identifying the error case encountered during request processing.
          example: UNAUTHORIZED
          type: string
          minLength: 0
          maxLength: 200
        Description:
          description: Human-readable short description of the reasonCode
          example: Unauthorized request
          type: string
          minLength: 0
          maxLength: 350
        Recoverable:
          description: Recoverable flag indicates whether this error is always returned for this request, or retrying could change the outcome.  For example, 'true' or 'false'.
          example: false
          type: boolean
        Details:
          description: Optional detailed description provides information about data received and calculated during request processing.  This helps the user to diagnose errors.
          example: Some optional detailed human readable explanation for the error.
          type: string
          nullable: true
          minLength: 0
          maxLength: 350
    Errors:
      title: Errors
      required:
      - Error
      type: object
      properties:
        Error:
          type: array
          description: Errors array wrapped in an error object
          items:
            $ref: '#/components/schemas/Error'
    ErrorWrapper:
      title: Error Response
      required:
      - Errors
      type: object
      properties:
        Errors:
          $ref: '#/components/schemas/Errors'
    ActionPlanConfig:
      type: object
      properties:
        automatic_action_plan_config:
          $ref: '#/components/schemas/AutomaticActionPlanConfig'
        issue_summary:
          $ref: '#/components/schemas/IssueSummary'
        manual_action_plan_config:
          $ref: '#/components/schemas/ManualActionPlanConfig'
    AutomaticActionPlanConfig:
      type: object
      properties:
        automated:
          type: boolean
          description: Is the action plan automated?
          example: true
        frequency:
          type: integer
          description: The frequency of the action plan.
          example: 30
          enum:
          - 30
          - 60
          - 90
        recipients:
          type: array
          description: An array of recipients.
          items:
            $ref: '#/components/schemas/Recipient'
    IssueSummary:
      type: object
      properties:
        action_plan_last_shared_on:
          type: string
          description: The date and time the action plan was last shared.
          example: '2021-10-01T22:18:57+00:00'
        current_open_issues_count:
          type: integer
          description: The count of currently open issues.
          example: 8
        total_resolved_issues_count:
          type: integer
          description: The count of resolved issues.
          example: 17
        total_shared_issues_count:
          type: integer
          description: The count of shared issues.
          example: 25
    ManualActionPlanConfig:
      type: object
      properties:
        recipients:
          type: array
          description: An array of recipients.
          items:
            $ref: '#/components/schemas/Recipient'
    Recipient:
      type: object
      required:
      - first_name
      - last_name
      - email
      - internal
      properties:
        first_name:
          type: string
          description: The first name of the recipient.
          example: John
        last_name:
          type: string
          description: The last name of the recipient.
          example: Doe
        email:
          type: string
          description: The email address of the recipient. External recipients domain checked against the TOE domain.
          example: john.doe@external.com
        internal:
          type: boolean
          description: Is the recipient internal? Internal recipients only receives confirmation emails when action plan is shared. At least one external recipient is required if not previously shared.
          example: false
    HostName:
      type: string
      nullable: true
      example: riskrecon.com
      description: The name of the host.
    HostingProvider:
      type: string
      nullable: true
      example: Riskrecon, Co.
      description: The hosting provider if available.
    PaginatedFinding:
      type: object
      required:
      - analysis_id
      - asset_value
      - domain_name
      - finding_data_description
      - finding_data_value
      - finding_detail
      - finding_extra_data_value
      - finding_id
      - finding_short_description
      - first_seen
      - host_name
      - hosting_provider
      - how_to_fix_it
      - ip_address
      - last_seen
      - security_criteria
      - security_domain
      - severity
      - priority
      - support_site
      - who_should_fix_it
      description: finding details
      properties:
        analysis_id:
          description: The unique identifier for an Analysis.
          example: '12345'
          type: string
        asset_value:
          description: The numeric asset_value associated with a findings host.
          example: '4'
          type: string
        cve_ids:
          nullable: true
          description: The CVE ids associated with the finding.
          type: array
          items:
            type: string
            description: The CVE ids associated with the finding.
            example: CVE-1999-0001
        domain_name:
          description: The domain name associated with a finding.
          nullable: true
          example: riskrecon.com
          type: string
        finding_data_description:
          description: The description of the finding data.
          example: Missing Security Headers
          type: string
        finding_data_value:
          description: The type of finding data.
          nullable: true
          example: shared_hosting
          type: string
        finding_detail:
          description: Details about the finding.
          nullable: true
          example: shared_hosting
          type: string
        finding_extra_data_value:
          type: string
          nullable: true
          description: Any additional data associated with finding.
          example: shared_hosting
        finding_id:
          type: string
          description: Unique identifier for the finding.
          example: 5976423a-ee35-11e3-8569-14109ff1a304
        finding_short_description:
          type: string
          nullable: true
          example: Missing Security Headers
          description: The finding data description.
        first_seen:
          description: The date the finding was first seen.
          example: '2020-10-10'
          type: string
        host_name:
          $ref: '#/components/schemas/HostName'
        hosting_provider:
          $ref: '#/components/schemas/HostingProvider'
        how_to_fix_it:
          type: string
          description: How to fix the finding.
          example: Update the software
        ip_address:
          type: string
          description: The ip address for the finding if available.
          example: 127.0.0.1
          nullable: true
        last_seen:
          description: The date the finding was last seen.
          example: '2020-10-10'
          type: string
        privacy_criteria:
          description: If the finding matches one of our categories in the privacy risk dimension, this field will contain the key of that security_criteria category.
          example: privacy_unencrypted_sensitive_systems
          type: string
          nullable: true
        security_criteria:
          description: The security_criteria category associated with the finding.
          example: software_patching
          type: string
        security_domain:
          description: The security_domain category associated with the finding.
          example: patching_app_server
          type: string
        severity:
          description: The severity for a finding.
          example: '4'
          type: string
        priority:
          description: The finding priority based on asset_value and severity.
          example: 5
          type: integer
        support_site:
          type: string
          description: The support site for the finding.
          example: https://support.riskrecon.com
        who_should_fix_it:
          type: string
          description: Who should fix the finding.
          example: The system administrator
    PaginatedFindings:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        data:
          type: array
          description: Data associated with response object.
          items:
            type: object
            properties:
              attributes:
                $ref: '#/components/schemas/PaginatedFinding'
              id:
                type: string
                example: '12345'
                description: The identifier associated with response object.
              type:
                type: string
                description: The type of object returned.
                example: finding
