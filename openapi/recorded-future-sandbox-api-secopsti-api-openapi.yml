  /samples/{sampleID}:
    delete:
      summary: Delete a sample
      description: Permanently delete a sample and all associated analysis data.
      operationId: deleteSample
      parameters:
      - $ref: '#/components/parameters/sampleID'
      responses:
        '200':
          description: Sample deleted.
          content:
            application/json:
              schema:
                type: object
                description: Empty response confirming deletion.
              example: {}
        '401':
          description: Permission denied. User does not have permission to delete this sample.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sample not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get sample details
      description: Retrieve a sample's analysis tasks and current processing status.
      operationId: getSample
      parameters:
      - $ref: '#/components/parameters/sampleID'
      responses:
        '200':
          description: Sample details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDetail'
              example:
                id: 260313-kmsmhagm42
