openapi: 3.1.0
info:
  title: recorded-future-sandbox-api-secopsti
  description: Recorded Future Sandbox API (formerly Hatching Tria.ge). Provides malware analysis capabilities including file/URL submission, behavioral analysis, YARA rule management, and organizational settings.
  version: '1.0'
servers:
- url: https://sandbox.recordedfuture.com/api/v0
security:
- sec0: []
paths:
  /geolocations:
    get:
      summary: List geolocations
      description: List available VPN exit points and regional tags for geographic routing in sandbox analysis.
      operationId: listGeolocations
      responses:
        '200':
          description: Available geolocations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Backend name
                        kind:
                          type: string
                          description: Resource type
                        geolocations:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Geolocation identifier (e.g., us-balti-tun, georgia-tun)
                              tags:
                                type: array
                                items:
                                  type: string
                                description: Region tags (e.g., europe, north-america, us)
              example:
                data:
                - name: sbx4m84
                  kind: sandbox
