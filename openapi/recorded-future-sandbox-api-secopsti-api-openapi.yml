                    description: Overall status
                    enum:
                    - pending
                    - running
                    - static_analysis
                    - reported
                    - failed
                  custom:
                    type: string
                    description: Custom metadata string (e.g., frontend session ID)
                  owner:
                    type: string
                    description: Submitting user ID
                  org_id:
                    type: string
                    description: Organization UUID
                  meta:
                    type: object
                    description: Submission metadata.
                    properties:
                      channel:
