  /samples:
    get:
      summary: List samples
      description: List sandbox samples in reverse chronological order with optional ownership filtering.
      operationId: listSamples
      parameters:
      - name: subset
        in: query
        description: Filter samples by ownership. `owned` returns the user's samples, `public` returns all publicly visible samples (public cloud only), `org` returns all organization samples.
        schema:
          type: string
          default: owned
          enum:
          - owned
          - public
          - org
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Paginated list of samples.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SampleSummary'
                  next:
                    type: string
                    description: Opaque cursor for the next page. Pass as the `offset` query parameter.
              example:
                data:
