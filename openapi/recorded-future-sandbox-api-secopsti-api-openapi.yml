  /profiles:
    post:
      summary: Create profile
      description: Create a reusable sandbox analysis profile defining OS, locale, network, timeout, and browser settings.
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - tags
              - timeout
              - network
              properties:
                name:
                  type: string
                  description: Unique profile name
                tags:
                  type: array
                  items:
                    type: string
                  description: OS and locale tags (e.g., os:windows10-2004-x64, locale:en-us)
                timeout:
                  type: integer
                  description: Analysis duration in seconds (max 3600)
                network:
                  type: string
                  description: Network mode
                  enum:
                  - ''
                  - drop
                  - internet
                  - tor
                  - sim200
                  - sim404
                  - simnx
                  - vpn
                geolocation:
                  type: string
                  description: Geographic region for VPN routing (required when network is vpn)
                options:
                  type: object
                  properties:
                    browser:
                      type: string
                      description: Browser for URL analysis (chrome, firefox)
      responses:
        '200':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 0a1851f2-9d4d-4cf8-9741-8bc96eed8dc0
                name: docs-example-profile
                tags:
                - discovery
                network: internet
                geolocation: null
                timeout: 120
                options: null
        '409':
          description: Profile name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List profiles
      description: List all reusable analysis profiles configured for your organization.
      operationId: listProfiles
      responses:
        '200':
          description: List of analysis profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                    - array
                    - 'null'
                    items:
                      $ref: '#/components/schemas/Profile'
                    description: Array of profiles, or null if no profiles exist.
                  next:
                    type:
                    - string
                    - 'null'
                    description: Pagination cursor for the next page of results. Null when no more results.
              example:
                data: null
                next: null
  /profiles/{profileID}:
    delete:
      summary: Delete profile
      description: Permanently remove an analysis profile without affecting previously analyzed samples.
      operationId: deleteProfile
      parameters:
      - name: profileID
        in: path
        description: Profile UUID or name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile deleted.
          content:
            application/json:
              schema:
                type: object
                description: Empty response confirming deletion.
              example: {}
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get profile
      description: Retrieve a single analysis profile by UUID or name.
      operationId: getProfile
      parameters:
      - name: profileID
        in: path
        description: Profile UUID or name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 0a1851f2-9d4d-4cf8-9741-8bc96eed8dc0
                name: docs-example-profile
                tags:
                - discovery
                network: internet
                geolocation: null
                timeout: 120
                options: null
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update profile
      description: Fully replace an existing analysis profile configuration (omitted optional fields reset to defaults).
      operationId: updateProfile
      parameters:
      - name: profileID
        in: path
        description: Profile UUID or name.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - tags
              - timeout
              - network
              properties:
                name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                timeout:
                  type: integer
                network:
                  type: string
                geolocation:
                  type: string
                options:
                  type: object
      responses:
        '200':
          description: Updated profile. Returns an empty JSON object on success.
          content:
            application/json:
              schema:
                type: object
              example: {}
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Profile name conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
