  /samples/{sampleID}/{taskID}/logs/{logType}.json:
    get:
      summary: Get behavioral logs
      description: Download raw kernel/system monitor logs capturing every process, file, registry, and network event from a behavioral task.
      operationId: getTaskLogs
      parameters:
      - $ref: '#/components/parameters/sampleID'
      - $ref: '#/components/parameters/taskID'
      - name: logType
        in: path
        description: 'Log type: `onemon` (Windows), `stahp` (Linux), `bigmac` (macOS), or `droidy` (Android).'
        required: true
        schema:
          type: string
          enum:
          - onemon
          - stahp
          - bigmac
          - droidy
      responses:
        '200':
          description: Behavioral log data in NDJSON (newline-delimited JSON) format.
          content:
            application/x-ndjson:
              schema:
                type: object
                description: Kernel monitor log output. Each line is a separate JSON object. Structure varies by log type.
              example: '{"kind":"onemon.NetworkListen","event":{"ip":0,"pid":2732,"port":49911,"procid":0,"proto":6,"ts":140}}

