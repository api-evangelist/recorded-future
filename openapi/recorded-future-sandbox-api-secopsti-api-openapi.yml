                          type: string
                          description: Target file or URL for this task
                        backend:
                          type: string
                          description: Sandbox backend that processed this task
                        resource:
                          type: string
                          description: VM resource profile used
                        pick:
                          type: string
                          description: Archive path of the selected file
                        os:
                          type: string
                          description: Operating system of the sandbox VM
                        timeout:
                          type: integer
                          description: Analysis timeout in seconds
                        sigs:
                          type: integer
                          description: Number of triggered signatures
                        failure:
