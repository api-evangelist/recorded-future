                          - urlscan
                        status:
                          type: string
                          description: Task status
                        tags:
                          type: array
                          items:
                            type: string
                          description: Behavior tags (e.g., discovery, ransomware, family:lockbit)
                        score:
                          type: integer
                          description: Task-level threat score (0-10)
