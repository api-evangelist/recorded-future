    post:
      summary: Submit a sample
      description: Submit a file or URL for sandbox malware analysis via upload, fetch, or import modes.
      operationId: submitSample
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - kind
              properties:
                kind:
                  type: string
                  description: 'Submission type: `file` (upload), `url` (analyze URL), `fetch` (download and analyze), or `import` (re-analyze existing sample).'
                  enum:
                  - file
                  - url
                  - fetch
                  - import
                file:
                  type: string
                  format: binary
                  description: The file to upload. Required when `kind` is `file`.
                url:
                  type: string
                  description: The URL to analyze or fetch. Required when `kind` is `url` or `fetch`.
                interactive:
                  type: boolean
                  description: If true, pauses after static analysis for manual profile selection via POST /samples/{sampleID}/profile.
                  default: false
                password:
                  type: string
                  description: Decryption password for archive files (zip/rar/etc).
                profiles:
                  type: array
                  description: Explicit file-to-profile mappings for analysis.
                  items:
                    type: object
                    properties:
                      profile:
                        type: string
                        description: Profile ID or name to use.
                      pick:
                        type: string
                        description: For archives, the filename within the archive this profile applies to.
                user_tags:
                  type: array
                  items:
                    type: string
                  description: Custom identification strings (max 1kB total).
                target:
                  type: string
                  description: Custom filename override or URL destination.
                _json:
                  type: string
                  description: 'Alternative: pass all parameters as a JSON string in this field instead of individual form fields.'
                defaults:
                  type: object
                  description: Default analysis parameters for automatic mode.
                  properties:
                    timeout:
                      type: integer
                      description: Analysis duration in seconds (max 3600).
                      default: 120
                    network:
                      type: string
                      description: 'Network mode: empty string (default), `drop`, `internet`, `tor`, `sim200`, `sim404`, `simnx`, or `vpn`.'
                      default: internet
                    geolocation:
                      type: string
                      description: Geographic region for VPN analysis. Required when network is `vpn`.
      responses:
        '200':
          description: Sample accepted for analysis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Assigned sample ID
                  status:
                    type: string
                    description: Initial status (always 'pending')
                    enum:
                    - pending
                  kind:
                    type: string
                    description: Submission type
                    enum:
                    - file
                    - url
                  filename:
                    type: string
                    description: Original filename (file submissions only)
                  url:
                    type: string
                    description: Submitted URL (URL submissions only)
                  private:
                    type: boolean
                    description: Whether the sample is private
                  submitted:
                    type: string
                    format: date-time
                    description: ISO 8601 submission timestamp
              example:
                id: 260603-eapgesas1q
                status: pending
                kind: url
                url: https://example.com
                submitted: '2026-06-03T03:44:25Z'
                user_id: 916869aa-27c4-42a4-8189-a19ce1b3a210
        '400':
          description: Bad request (e.g., missing required fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
