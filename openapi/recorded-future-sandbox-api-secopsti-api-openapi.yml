      summary: Search samples
      description: Search sandbox analyses by hash, malware family, tag, or network indicator.
      operationId: searchSamples
      parameters:
      - name: query
        in: query
        description: 'Search query. Examples: `family:wannacry`, `sha256:abc123...`, `tag:ransomware AND from:2024-01-01`, `domain:evil.com`, `ip:1.2.3.4`.'
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
