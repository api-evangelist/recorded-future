                    description: Overall threat score (0-10, where 10 is most malicious)
                  sha256:
                    type: string
                    description: SHA-256 hash of submitted file
                  tasks:
                    type: object
                    description: Analysis tasks keyed by composite ID (sampleID-taskName).
