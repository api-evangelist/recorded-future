  /samples/{sampleID}/profile:
    post:
      summary: Set analysis profile
      description: Resume a paused interactive-mode submission by selecting analysis profiles for behavioral execution.
      operationId: setSampleProfile
      parameters:
      - $ref: '#/components/parameters/sampleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto:
                  type: boolean
                  description: If true, automatically select profiles for all files.
                pick:
                  type: array
                  items:
                    type: string
                  description: 'For archives: list of filenames to run with automatic profile selection.'
                profiles:
                  type: array
                  description: Explicit file-to-profile mappings.
                  items:
                    type: object
                    properties:
                      pick:
                        type: string
                        description: Filename within the archive (or 'sample' for the submitted file).
                      profile:
                        type: string
                        description: Profile ID or name to use for this file.
      responses:
        '200':
          description: Profile set successfully. Sample transitions to running status.
          content:
            application/json:
              schema:
                type: object
                description: Empty response confirming profile selection.
        '404':
          description: Sample not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Profile cannot be set (sample not in static_analysis status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
