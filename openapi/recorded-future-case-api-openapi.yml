  /lookup/{id}:
    get:
      operationId: lookup
      description: Retrieve full case details for a single case by ID (known routing bug — prefer POST /lookup with a single ID instead).
      summary: Lookup a Case using its ID
      tags:
      - Case
      parameters:
      - name: id
        in: path
        required: true
        description: Id of a Case
        schema:
          type: string
          maxLength: 41
        deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CaseLookupResponse'
        '404':
          description: No such case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search:
    post:
      operationId: search
      summary: Searches for any Case matching the criteria
      description: Search cases by filter criteria to get matching case IDs, which can then be passed to the lookup endpoint for full details.
      tags:
      - Case
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchRequest'
            examples:
              newHighUnassigned:
                summary: Search for all Cases with Status 'New', Priorities 'Moderate' or 'High', which are unassigned.
                value:
                  statuses:
                  - New
                  priorities:
                  - Moderate
                  - High
                  assignees:
                  - ''
              resolvedInformationalIncluded:
                summary: Search for all Cases which were modified in April 2025, assigned to a specific user.
                value:
                  assignees:
                  - uhash:123124
                  modified:
                    from: '2025-04-01T00:00:00.000+02:00'
                    to: '2025-05-01T00:00:00.000+02:00'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSearchResponse'
              example:
                status:
                  status_code: OK
                  status_message: Case search successful.
                data:
                - task:ff470692-3225-4e05-881c-1e7409c803b3
                - task:9cc649f8-68e7-417c-bb8b-2de34f11ff8d
                - task:c155e367-6be3-44b4-8c25-2c1e11c85eb9
                - task:d8a3edcb-8cec-450e-a3a3-508e5e36d10b
                - task:8993234b-96a7-43a5-941c-1823ae621ac3
                counts:
                  returned: 5
                  total: 5
                next_offset: eyJvZmZzZXQiOlsxNzYxMTI4MDgwNTAxLCJ0YXNrOjg5OTMyMzRiLTk2YTctNDNhNS05NDFjLTE4MjNhZTYyMWFjMyJdfQ==
  /update:
    put:
      operationId: update
      summary: Update Assignee, Status, Priority, Title or Description of a Case
      description: Update assignee, status, priority, title, or description on an existing case.
      tags:
      - Case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/UpdateRequest'
            examples:
              escalate:
                summary: Set the Status to In Progress, Priority High, and Assign a User to the Case
                value:
                  id: task:96b12d30-b14c-461f-8377-fc36a01c91fe
                  status: InProgress
                  priority: High
                  assignee: uhash:2vefBNqkbi
              removeAssignee:
                summary: Set Case as Unassigned with a blank String
                value:
                  id: task:96b12d30-b14c-461f-8377-fc36a01c91fe
                  assignee: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/UpdateCaseResponse'
              example:
                status:
                  status_code: OK
                  status_message: Successfully updated Case.
components:
  schemas:
    CreateCaseRequest:
      type: object
      properties:
        context:
          $ref: '#/components/schemas/CreateContext'
        organization:
          $ref: '#/components/schemas/UserIdentity'
        status:
          $ref: '#/components/schemas/CaseStatus'
        priority:
          $ref: '#/components/schemas/CasePriority'
        title:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 1000
        assignee:
          $ref: '#/components/schemas/UserIdentity'
      description: Request to create a new case from an alert context.
    CreateCaseResponse:
      type: object
      properties:
        status:
          type: object
          $ref: '#/components/schemas/Status'
        data:
          $ref: '#/components/schemas/TaskIdentity'
      description: Newly created case with its assigned ID.
    CreateContext:
      oneOf:
      - $ref: '#/components/schemas/CreateReferenceAlertContext'
      - $ref: '#/components/schemas/CreateSignalAlertContext'
      discriminator:
        propertyName: type
        mapping:
          reference_alert: '#/components/schemas/CreateReferenceAlertContext'
          signal_alert: '#/components/schemas/CreateSignalAlertContext'
      description: Alert context for case creation. Uses discriminator to select between reference and signal alert types.
    CreateReferenceAlertContext:
      type: object
      properties:
        type:
          type: string
          enum:
          - reference_alert
        references:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceId'
          maxItems: 100
        alert_notification:
          $ref: '#/components/schemas/AlertNotificationId'
        alert_rule:
          $ref: '#/components/schemas/AlertRuleId'
      required:
      - type
      - references
      - alert_notification
      - alert_rule
      description: Alert context for reference-based cases, linking to document references and alert notifications.
    CreateSignalAlertContext:
      type: object
      properties:
        type:
          type: string
          enum:
          - signal_alert
        entity:
          $ref: '#/components/schemas/Identity'
        alert_rule:
          $ref: '#/components/schemas/AlertRuleId'
        alert_notification:
          $ref: '#/components/schemas/AlertNotificationId'
        risk_evidences:
          type: array
          items:
            $ref: '#/components/schemas/RiskEvidence'
          maxItems: 100
        references:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceId'
          maxItems: 100
        cyber_level:
          $ref: '#/components/schemas/CyberLevel'
      required:
      - type
      - entity
      - alert_rule
      - alert_notification
      oneOf:
      - required:
        - risk_evidences
        not:
          required:
          - references
      - required:
        - references
        not:
          required:
          - risk_evidences
      description: Alert context for signal-based cases, linking to entities, risk evidence, and alert notifications.
    CaseStatus:
      type: string
      enum:
      - New
      - InProgress
      - Dismissed
      - Resolved
      description: The Status of the Case
      example: InProgress
    CasePriority:
      type: string
      enum:
      - Informational
      - Moderate
      - High
      description: The Priority of the Case
      example: High
    CyberLevel:
      type: object
      properties:
        attacker:
          type: integer
          maximum: 4
          minimum: 1
        method:
          type: integer
          maximum: 4
          minimum: 1
        operation:
          type: integer
          maximum: 4
          minimum: 1
        target:
          type: integer
          maximum: 4
          minimum: 1
      description: Cyber kill chain level classification (attacker, method, operation, target).
    Status:
      type: object
      properties:
        status_code:
          type: string
        status_message:
          type: string
      description: API response status with code and message.
    RiskEvidence:
      type: object
      properties:
        rule_description:
          type: string
          description: The Description field of the risk rule
          example: Historical Suspected C&C Server
          maxLength: 128
        timestamp:
          type: string
          format: date-time
          maxLength: 24
      description: Risk evidence linking a risk rule to a timestamp.
    AlertRuleId:
      type: string
      pattern: ^report:[a-zA-Z0-9]{3,20}$
      description: The id of of an alert rule, prefixed with 'report:'
      example: report:FNESDXuhyYs
      maxLength: 20
    AlertNotificationId:
      type: string
      format: identity
      description: Internal alert notification ID (e.g., 4e4GmW). This is NOT the same as alert IDs returned by the v3 Alerts API — it is an internal notification identifier. Using alert IDs from the Alerts API will result in errors.
      example: 4e4GmW
      maxLength: 16
    ReferenceId:
      type: string
      format: identity
      description: The identity of a Reference
      example: HFBUAAAAACJ
      maxLength: 16
    TaskIdentity:
      type: string
      format: identity
      description: The identity of a task
      example: task:96b12d30-b14c-461f-8377-fc36a01c91fe
      maxLength: 41
    Identity:
      type: string
      format: identity
      description: The id of an entity
      example: B_E-R
      maxLength: 10
    UserIdentity:
      type: string
      format: identity
      example: uhash:2vefBNqkbi
      maxLength: 24
      description: Organization identity string in uhash:<hash> format (e.g., uhash:2vefBNqkbi). This is the organization ID, not a user identity.
    DeleteCaseResponse:
      type: object
      properties:
        status:
          type: object
          $ref: '#/components/schemas/Status'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/TaskIdentity'
        ignored:
          type: array
          items:
            $ref: '#/components/schemas/TaskIdentity'
      description: Result of a case deletion, showing which cases were deleted vs ignored (already deleted/not found).
    AssigneesRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TaskIdentity'
        limit:
          type: integer
          minValue: 1
        text:
          type: string
      required:
      - id
      description: Request to retrieve eligible assignees for a case.
    CaseAssigneesResponse:
      type: object
      properties:
        status:
          type: object
          $ref: '#/components/schemas/Status'
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
      description: List of eligible assignees for a case.
    User:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        user_id:
          type: string
      required:
      - name
      description: A Recorded Future user (assignee, creator, or author).
    CaseLookupBulkRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/TaskIdentity'
        panels:
          $ref: '#/components/schemas/StandardPanels'
        logLimit:
          type: integer
          maxValue: 100
          minvalue: 1
          description: How many history items of each Case should be returned
          nullable: true
          example: 10
      required:
      - ids
      - panels
      description: Request to look up multiple cases by their IDs with optional panel selection.
    CaseLookupBulkResponse:
      type: object
      properties:
        status:
          type: object
          $ref: '#/components/schemas/Status'
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExternalCase'
          description: Map of TaskIdentity strings to case objects.
      description: Bulk case lookup response with requested panels.
    StandardPanels:
      description: 'Request inclusion of detailed Case data, grouped into a set of panels. If left unset, all panels will be returned.

        '
      type: array
      items:
        type: string
        enum:
        - summary
        - details
        - log
      example:
      - summary
      - details
      - log
    ExternalCase:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TaskIdentity'
        summary:
          $ref: '#/components/schemas/CaseSummaryPanel'
        details:
          $ref: '#/components/schemas/CaseDetailsPanel'
        log:
          type: array
          items:
            $ref: '#/components/schemas/CaseLogPanel'
      description: A case with expanded detail panels (summary, details, log).
    CaseSummaryPanel:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TaskIdentity'
        status:
          $ref: '#/components/schemas/CaseStatus'
        priority:
          $ref: '#/components/schemas/CasePriority'
        title:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 1000
        assignee:
          $ref: '#/components/schemas/User'
        creator:
          $ref: '#/components/schemas/User'
        created:
          type: string
          format: date-time
          maxLength: 24
        modified:
          type: string
          format: date-time
          maxLength: 24
      description: Summary panel with case metadata (status, priority, assignee, timestamps).
    CaseDetailsPanel:
      oneOf:
      - $ref: '#/components/schemas/ReferenceAlertDetails'
      - $ref: '#/components/schemas/SignalAlertDetails'
      discriminator:
        propertyName: type
        mapping:
          reference_details: '#/components/schemas/ReferenceAlertDetails'
          signal_details: '#/components/schemas/SignalAlertDetails'
      description: Detail panel with alert-specific data. Uses discriminator for signal vs reference alert types.
    SignalAlertDetails:
      type: object
      required:
      - type
      - entities
      properties:
        type:
