openapi: 3.1.0
info:
  version: 0.1.0
  title: Case
  description: A very descriptive description will be available Soon(TM)
  contact:
    name: Alerts Team
servers:
- url: https://api.recordedfuture.com/case
security:
- ApiKeyAuth: []
- idp: []
paths:
  /assignees:
    post:
      operationId: eligibleAssignees
      description: List users in an organization who are eligible to be assigned to a specific case, with optional name or email filtering.
      summary: Retrieve all eligible assignees for a Case
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssigneesRequest'
      tags:
      - Metadata
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseAssigneesResponse'
              example:
                status:
                  status_code: OK
                  status_message: Successfully retrieved eligible Assignees for Case.
                data:
                - name: Unassigned
                  user_id: ''
                - name: InfoSec
                  email: user@example.com
                  user_id: uhash:1FsegTfQCA
                - name: Jordan Rivera
                  email: user@example.com
                  user_id: uhash:1G0xnyoIHT
                - name: Julian Kraus
                  email: user@example.com
                  user_id: uhash:1LtXGjMUk4
                - name: Gamze
                  email: user@example.com
                  user_id: uhash:1O6eYFYQoy
                - name: Elisabeth Marklund
                  email: user@example.com
                  user_id: uhash:1Vb0FM4qK2
                - name: Love Karlsson
                  email: user@example.com
                  user_id: uhash:1Z2yFrdSYr
                - name: Patrick Youn
                  email: user@example.com
                  user_id: uhash:1dW4KNw4Nj
                - name: Admin
                  email: user@example.com
                  user_id: uhash:1gf2HLe4ED
                - name: Ash Rafipour
                  email: user@example.com
                  user_id: uhash:1jY4xm9kal
                - name: Wolfgang Walder
                  email: user@example.com
                  user_id: uhash:1mzNxQUrig
                count: 11
  /create:
    post:
      operationId: create
      description: Create a new case linked to a reference alert (document-based) or signal alert (entity risk-based) for triage and investigation.
      summary: Build a Case around a Reference Alert, or a Signal Alert
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
            examples:
              fromReference:
                summary: From Reference Alert
                value:
                  context:
                    type: reference_alert
                    alert_notification: 4e4GmW
                    alert_rule: report:FNESDXucADs
                    references:
                    - HFBUAAAAACJ
                    - HFBUAAABBAB
                  organization: uhash:2vefBNqkbi
                  status: InProgress
                  priority: High
                  title: Dinosaurs break out of State of the Art amusement Park
                  description: Guess you shouldn't skimp out on IT.
              fromRisk:
                summary: From Risk Signal Alert
                value:
                  context:
                    type: signal_alert
                    entity: B-AMF
                    alert_rule: report:FNESDXuhyYs
                    alert_notification: 4e4GmW
                    references:
                    - HFBUAAAAACJ
                    - HFBUAAABBAB
                  organization: uhash:2vefBNqkbi
                  status: Resolved
                  priority: Informational
                  title: Magic, evil ring destroyed
                  description: Middle-earth rejoice
                  assignee: uhash:2vefBNqkbi
              fromCyber:
                summary: From Cyber Signal Alert
                value:
                  context:
                    type: signal_alert
                    entity: B-AMF
                    alert_rule: report:FNESDXuhyYs
                    alert_notification: 4e4GmW
                    risk_evidences:
                    - rule_description: Historical Suspected C&C Server
                      timestamp: '2024-09-16T10:47:19.695Z'
                    cyber_level:
                      attacker: 3
                  organization: uhash:2vefBNqkbi
                  status: InProgress
                  priority: High
                  title: Magic, evil ring destroyed
                  description: Middle-earth rejoice
                  assignee: uhash:2vefBNqkbi
      tags:
      - Case
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseResponse'
              example:
                status:
                  status_code: OK
                  status_message: Successfully created Case
                data: task:17b56cdf-9f9c-4c63-962b-17e49395e731
  /delete:
    delete:
      operationId: deleteMany
      description: Bulk-delete up to 100 cases by ID, with partial-success handling that distinguishes deleted from already-removed cases.
      summary: Deletes specified Cases
      tags:
      - Case
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskIdentity'
              maxItems: 100
            example:
            - task:e66b879c-afd0-4ada-8d84-d57671baa63d
            - task:553bde7b-bfd9-4ea2-9a15-bb271b30df15
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCaseResponse'
              example:
                status:
                  status_code: OK
                  status_message: Successfully deleted case.
                deleted:
                - task:17b56cdf-9f9c-4c63-962b-17e49395e731
                ignored: []
  /delete/{id}:
    delete:
      operationId: delete
      description: Permanently remove a single case by its ID (idempotent — already-deleted or non-existent cases return success).
      summary: Deletes one Case
      tags:
      - Case
      parameters:
      - name: id
        in: path
        schema:
          $ref: '#/components/schemas/TaskIdentity'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCaseResponse'
              example:
                status:
                  status_code: OK
                  status_message: Successfully deleted case.
                deleted:
                - task:1264c6cd-cdc7-4d98-929c-8d98ec004056
                ignored: []
  /lookup:
