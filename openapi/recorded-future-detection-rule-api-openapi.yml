openapi: 3.0.3
info:
  title: Detection Rule API
  description: 'The Detection Rule API allows clients to programmatically search for and download YARA, Sigma, and Snort rules

    authored by Recorded Future''s Insikt Group.


    Please read the [detailed support article](https://support.recordedfuture.com/hc/en-us/articles/5265933996819-Detection-Rule-API) before using this API.

    '
  version: 0.0.8
  x-rf-service-id: service:detection-rule
servers:
- url: https://api.recordedfuture.com/detection-rule
paths:
  /search:
    post:
      summary: Search Detection Rules
      description: Search Insikt Group detection rules with deployable YARA, Sigma, and Snort source code.
      security:
      - key: []
      - idp: []
      tags:
      - Detection Rules
      servers:
      - url: /detection-rule
        x-internal: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  $ref: '#/components/schemas/DetectionRuleFilter'
                tagged_entities:
                  type: boolean
                  default: false
                  description: If set to true, the entity ID of tagged entities in the title and body of the Insikt Note associated with the detection rule will be included.
                limit:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 10
                  description: Sets the limit of total number of rules that will be returned in the result set. If the search has more results than the specified limit, the `next_offset` value in the response can be used in the `offset` value of the next request to get the next set of results.
                offset:
                  type: string
                  description: This value, if specified with the `next_offset` value of a prior result, will indicate where to start showing results from. To see the first set of results of the search, this parameter should be omitted.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionRuleResult'
              example:
                count: 3
                total_count: 1880
                result:
                - id: doc:oJeqDP
                  type: yara
                  title: Hunting NewWave Ransomware
                  description: 'Insikt Group analyzed NewWave ransomware to create the attached YARA rule for the dropper and the extracted ransomware file. When the dropper file is unzipped, it extracts 4 binaries, 3 of which are legitimate files: one is 7zip, one is a legitimate copy of Everything.exe, and one is Everything32.dll. The final extracted file, Everything64.dll, is a password-protected zip file that contains 5 malicious files. Two legitimate files, sdel.exe and sdel64.exe are included; the other 3 include 2 configuration-related files (Everything.ini and Everything2.ini) and one executable file, encrypt.exe which is responsible for the ransomware-related behavior. Sdel.exe and sdel64.exe are associated with the Windows utility Sdelete which permits a user to delete files and directories.


                    At a high level, the ransomware has the following functionalities, which include fairly extensive measures to ensure programs, services and Windows configurations that would possibly enable recovery are shut down or disabled:

                    - Collects system information, including Windows version, hardware information such as available memory, number of cores, user information and places it in a file C:\\temp\session.tmp and another file C:\\temp\hashlist containing all MD5 hashes of files the malware encrypts

                    - Modifies IEFO debugger key for several programs, including Everything.exe, Task Manager, and Task Kill in order to prevent them from running. Several of these programs may allow the victim to stop the ransomware from executing.

                    - Modifies power settings using Powercfg.exe, and registry setting modifications, including disabling hibernation, to prevent the victim from shutting down the machine or logging off

                    - Whitelists specific processes such as cmd.exe, LogonUI.exe, smss.exe, winlogon.exe

                    - Kills system services including WerSvc, BITS, DiagTrack and dmwappushservice

                    - Kills processes such as SearchIndexer.exe, SearchApp.exe, wsqmcons.exe

                    - Disables telemetry via the registry key SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\DataCollection and “AllowTelemetry” subkey

                    - Modifies boot policy using bcdedit.exe /set {default} bootstatuspolicy ignoreallfailures and bcdedit.exe /set {default} recoveryenabled no and deletes system backup files using wbadmin.exe DELETE SYSTEMBACKUP and wbadmin.exe delete catalog -quiet to make recovery more challenging and prevent recovery mode from being used

                    - Loads hidden partitions by attempting to mount drives lettered A:\\ to Z:\\

                    - Automatically elevates permissions via UAC bypass, then does process injection into explorer.exe

                    - The ransomware drops a note in the C:\ directory named “How-to-decrypt.txt” with instructions for the victim. The malware opens notepad.exe, displaying the ransom note.

                    - Accepts parameters for verbose logging, process injection, and network functionality'
                  created: '2022-09-27T15:27:18.379Z'
                  updated: '2022-09-27T15:29:36.873Z'
                  rules:
                  - entities:
                    - id: J0Nl-p
                      type: MalwareCategory
                      name: Ransomware
                    - id: oJZAhV
                      type: Malware
                      name: NewWave Ransomware
                    content: "import \"pe\"\n\n\nrule MAL_NewWave_ransomware_dropper\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2022-09-20\"\n        description = \"Rule for New Wave Ransomware dropper\"\n        version = \"1.0\"\n\n    strings:\n        $s1 = \"RunProgram=\\\"hidcon:7za.exe i \\\"\"\n        $s2 = \"Everything64.dll\"\n        $s3 = \"RunProgram=\\\"hidcon:encrypt.exe -e all -sd -crc %SfxVarCmdLine0%\\\"\"\n\n    condition:\n        filesize > 1500KB and uint16(0) == 0x5A4D\n        and all of them\n}\n\nrule MAL_NewWave_ransomware\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2022-09-20\"\n        description = \"Rule for New Wave Ransomware\"\n        version = \"1.0\"\n\n    strings:\n        $s1 = \"[*] CLONE INFO: I'm original process!\" wide ascii\n        $s2 = \"[-] Auto-elevation failed!\" wide ascii \n        $s3 = \"[*] Everything Setup\" wide ascii\n        $s4 = \"\
                      [*] Kill System Services (telemetry, booster, etc)\" wide ascii\n        $s5 = \"\\\\sdel.exe\\\" -accepteula -p 3 -c\" wide ascii\n        $s6 = \"\\\\temp\\\\lock.txt\" wide ascii\n\n    condition:\n        filesize > 900KB and uint16(0) == 0x5A4D\n        and all of them\n\n}\n"
                    file_name: MAL_newwave_ransomware.yar
