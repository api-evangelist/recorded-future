                    content: "rule MAL_Hog_Ransomware_Payload {\n    meta:\n        author = \"DGRANGE, Insikt Group, Recorded Future\"\n        date = \"2021-03-19\"\n        description = \"Detects Hog Ransomware payload\"\n        version = \"1.0\"\n        reference = \"https://app.recordedfuture.com/live/sc/A6jQHqktcYhy\"\n        hash = \"209eeb95b61cb7114baa21b7599641e34e825a4887ad0466c2cf2ac3cb4c4695\"\n\n   strings:\n      $h1 = \"HogRansomware\" fullword wide ascii // Ransomware name\n      $h2 = \"HogRansomwareDecryptor\" fullword wide ascii // Ransowmare decryptor name\n\n      $del = \"/C choice /C Y /N /D Y /T 1 & Del\" fullword ascii // Ransomware launches choice.exe via command line to delete itself\n      \n      $dis = \"https://discord.com/api/v8/invites\" fullword wide // Call to Discord API\n\n      $c1 = \"EncryptFiles\" fullword ascii\n      $c2 = \"DecryptFile\" fullword ascii\n      $c3 = \"DECRYPT-MY-FILES.exe\" fullword ascii // Launch decryptor\n   condition:\n\
                      \      uint16(0) == 0x5a4d and filesize < 1000KB and\n      ( ( ($del) and ($dis) and 2 of ($c*) ) or\n      ( 1 of ($h*) and 2 of them ) )\n}\n\nrule MAL_Hog_Ransomware_Ransom_Note {\n    meta:\n        author = \"DGRANGE, Insikt Group, Recorded Future\"\n        date = \"2021-03-19\"\n        description = \"Detect Hog Ransomware ransom note\"\n        version = \"1.0\"\n        reference = \"https://app.recordedfuture.com/live/sc/A6jQHqktcYhy\"\n        hash = \"209eeb95b61cb7114baa21b7599641e34e825a4887ad0466c2cf2ac3cb4c4695\"\n\n   strings:\n      $s1 = \"Your personal files have been encrypted by the Hog Ransomware.\" fullword ascii\n      $s2 = \"They have been encrypted using unbreakable AES-256 encryption.\" fullword ascii\n      $s3 = \"A \\\".hog\\\" file extension has been appended to the encrypted files.\" fullword ascii\n      $s4 = \"Please do not remove it, as it is needed to locate and decrypt them.\" fullword ascii\n      $s5 = \"Attempting to modify\
                      \ the encrypted files can result in irreversible data loss.\" fullword ascii\n      $s6 = \"In order to decrypt your files, you will need to join our Discord server.\" fullword ascii\n      $s7 = \"Once you have joined, enter your Discord account token in the box below.\" fullword ascii\n      $s8 = \"Press \\\"Decrypt My Files!\\\" and if you have joined, your files will be decrypted.\" fullword ascii\n      $s9 = \"Have a nice day!e day!\" fullword ascii\n   condition:\n      filesize < 1000KB and 5 of them\n}\n"
