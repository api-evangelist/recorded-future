                - id: doc:hq7CrJ
                  type: yara
                  title: 'Insikt Validated TTP: New Hog Ransomware Tells Victims to Join a Discord Server, Source Code and Payload Published on Github'
                  description: 'Insikt Group observed Github user InstinctEx publish the source code and a sample of Hog Ransomware — though InstinctEx claims that they are not the author of the ransomware. This new ransomware variant — which Insikt Group has previously reported on — requires victims to join a specified Discord server in order to decrypt their files for free. Insikt Group obtained the Github package for analysis and confirmed the identification as Hog Ransomware. The repository also contained source code for the Hog Ransomware Decryptor. Once executed, the ransomware checks if the attacker’s Discord server exists. If the server doesn’t exist, the ransomware terminates its process and deletes itself using the choice.exe process via the command line. If the server exists, it encrypts the victim machine’s files using an AES-256 algorithm and appends a ".hog” extension to the encrypted files. The ransom note is dropped in the Windows Startup folder and is executed once the file
                    encryption is complete. It contains instructions to join a certain Discord server and asks the victim to provide their Discord token to verify they have joined the server. The ransomware then authenticates via Discord’s API if the user has joined the server. If verified that the victim has joined the server, the ransomware will decrypt the victim’s files using a static key embedded in the ransomware.


                    Insikt Group created YARA rules to detect Hog Ransomware’s payload and ransom note, which can be found attached to this note. A link to the GitHub repository containing the Hog Ransomware source code and sample can be found in the Validation URL section of this note. IOCs for the original Hog Ransomware sample analyzed, as well as other samples surfaced using our YARA rules, have also been added to this note as related entities.'
                  created: '2021-03-19T00:00:00.000Z'
                  updated: '2021-03-19T21:54:30.309Z'
