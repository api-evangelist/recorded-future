                      name: 0be57d1244fefc679feb7aa9996e539481be7b8f4c9246817f81caa8c2f61a57
                    content: "import \"pe\"\nimport \"hash\"\n\n\nrule APT_RU_APT29_FatDuke_loader\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"rule to detect fatduke loader\"\n        version = \"1.0\"\n        hash = \"5b8467a9a89d83d721d28fb45fbe0ce53a9ee284b7aad93bff178ed6ea26247a\"\n        platform = \"windows\"\n        RF_MALWARE = \"FatDuke\"\n        RF_THREATACTOR = \"APT29\"\n        RF_MALWARE_ID = \"bnZI5p\"\n        RF_THREATACTOR_ID = \"O7NRMb\"\n\n    strings:\n        $s1 = \"0ffbea9d84d353e5e3179aae\" //rundll32.exe encoded\n        $s2 = \"0be7dfa577dc931827\"  //nacl_user encoded\n        $s3 = \"e0c0d8898ad68725161f428fc81bda249e34949d57543c0e06206a079b91b222e8b10c9f9330618eb42e4f517973724ea483ca\" //dll path encoded\n    condition:\n        all of them and filesize > 50KB and uint16(0) == 0x5a4d\n}\nrule APT_RU_APT29_FatDuke_backdoor\n{\n    meta:\n        author = \"LKAYE, Insikt Group,\
                      \ Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"rule to detect fatduke payload type 2\"\n        version = \"1.0\"\n        hash = \"0be57d1244fefc679feb7aa9996e539481be7b8f4c9246817f81caa8c2f61a57\"\n        hash = \"a95449f7c7c1ea5359bd76f25f57b89802d94f649ba059b910d8e46d9a914fcf\"\n        platform = \"windows\"\n        RF_MALWARE = \"FatDuke\"\n        RF_THREATACTOR = \"APT29\"\n        RF_MALWARE_ID = \"bnZI5p\"\n        RF_THREATACTOR_ID = \"O7NRMb\"\n\n    strings:\n        $p1 = {c7 85 b8 ec ff ff 43 61 6e 6e c7 85 bc ec ff ff 6f 74 20 69 c7 85 c0 ec ff ff 6e 69 74 69 c7 85 c4 ec ff ff 61 6c 69 7a} //string obf type 2 from 0be57 sample \"Cannot initializ...\"\n        $s1 = {b1 49 f6 e9 8b 0d 78 76 40 10 88 85 30 ff ff ff a1 7c 76 40 10 8a c1 b1 6e f6 e9 8b 0d 78 76 40 10 88 85 31 ff ff ff a1 7c 76 40 10 8a c1 b1 74 f6 e9 8b 0d 78 76 40 10 88 85 32 ff ff ff a1 7c 76 40 10 8a c1 b1 65 f6 e9} //string obfuscation type 1 from sample\
                      \ a9544\n        $r1 = \"eyJjb25maWdfaW\" wide ascii //beginning of base64-ed config from resource 7\n        $r2 = {69 48 14 fd 43 03 00 81 c1 c3 9e 26 00 89 48 14 c1 e9 10 81 e1 ff 7f 00 00 8b c1 c3} //parts of randinit function used by APT29 for opaque predicates\n    condition:\n        (($p1 and pe.exports(\"GetProxyDllInfo\")) or ($s1 and pe.exports(\"nacl_user\"))) and all of ($r*) and filesize > 2900KB and uint16(0) == 0x5a4d\n}\nrule APT_RU_APT29_powerduke_backdoor\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"rule to detect powerduke backdoor file\"\n        version = \"1.0\"\n        hash = \"6119c92f5b5cb2cd953925e17ceb4a02a9007029dd27a35d44b116ff9718f814\"\n        hash = \"3bd7a49b769c9c3559af68de94b03ef537fc520e2e8c5513d3ee883db2d86ddf\"\n        hash = \"a870660d33b9801210f956e27d2e4ae329ca84acb132f4cdfccd3caee84b1b9a\"\n        RF_MALWARE = \"PowerDuke\"\n        RF_THREATACTOR\
                      \ = \"APT29\"\n        RF_MALWARE_ID = \"SD8ZVN\"\n        RF_THREATACTOR_ID = \"O7NRMb\"\n\n    strings:\n        $s1 = {8b 4d 0c 2b 4d 08 8a 06 32 47 ff 32 47 fe 88 06 4e 4f} //decryption of ordinal sections\n        $s2 = {c7 45 d4 61 64 76 61 c7 45 d8 70 69 33 32 c7 45 dc 2e 64 6c 6c c6 45 e0 00} //advapi stackstring\n        $s3 = {c7 45 e1 77 69 6e 68 c7 45 e5 74 74 70 2e 66 c7 45 e9 64 6c c6 45 eb 6c c6 45 ec 00} //winhttp stackstring\n        $s4 = {c7 45 ed 73 68 65 6c c7 45 f1 6c 33 32 2e 66 c7 45 f5 64 6c c6 45 f7 6c c6 45 f8 00 c7 45 f9 00 00 00 00} //shell32 stackstring\n        $s5 = \"hi_bdf\"\n    condition:\n        all of them and uint16(0) == 0x5a4d and filesize > 10KB\n}\nrule APT_RU_APT29_powerduke_lnkfile\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"rule to detect powerduke lnk file\"\n        version = \"1.0\"\n        hash = \"2d2fa32f928f8abf31b9e79153422d65fe72cd5ad0d1f815a9d2ffa42fc8d224\"\
                      \n        RF_MALWARE = \"PowerDuke\"\n        RF_THREATACTOR = \"APT29\"\n        RF_MALWARE_ID = \"SD8ZVN\"\n        RF_THREATACTOR_ID = \"O7NRMb\"\n\n    strings:\n        $s1 = \"C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\" wide ascii\n        $s2 = \"%SystemRoot%\\\\System32\\\\shell32.dll\" ascii\n        $s3 = \"user-pc\" ascii\n        $s4 = {4241 4141 4541 4141 bebe 4141 f941 4141} //some of the base64-ed data\n        $s5 = \"ASCII.GetString([Convert]::FromBase64String('JG9zPTB4MDAw\" wide ascii //do decode for base64ed powershell beginning\n        $s6 = \"<<CgpmdW5jdGlvbiBwbF9kcm\" ascii //beginning of more encoded data\n    condition:\n        (uint32be(0x0) == 0x4c000000 and uint32be(0x4) == 0x1140200) and all of them and filesize < 700KB\n}\nrule APT_RU_APT29_powerduke_dropper\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"rule to detect powerduke\
                      \ dropper\"\n        version = \"1.0\"\n        hash = \"4538af0a76fecc6e45e6d45c22618c52ba89bf596a0b68dd2d4d2358fb5c86ef\"\n        RF_MALWARE = \"PowerDuke\"\n        RF_THREATACTOR = \"APT29\"\n        RF_MALWARE_ID = \"SD8ZVN\"\n        RF_THREATACTOR_ID = \"O7NRMb\"\n\n    strings:\n        $s1 = \"7kQr7Ji8Q8OE\" ascii\n        $s2 = \"e8uQhuFJ4uyQLLJPAE\" wide ascii\n        $s3 = \".ItqTb7fZ05YnxcMPuOgWSAoQyLE2FeD1r8KU3Rkdp4sNXj9HzBmGvV6JialhwC\" wide ascii\n    condition:\n        all of them and uint16(0) == 0x5a4d and filesize > 1000KB\n}\nrule APT_RU_APT29_Miniduke_2019 {\n    meta:\n        author = \"GLES, Insikt Group, Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"Track variants of Miniduke based on the API hashing function it uses to obfsucate functionality\"\n        version = \"1.0\"\n        reference = \"https://www.welivesecurity.com/wp-content/uploads/2019/10/ESET_Operation_Ghost_Dukes.pdf\"\n        hash = \"6057b19975818ff4487ee62d5341834c53ab80a507949a52422ab37c7c46b7a1\"\
                      \n        RF_MALWARE = \"Miniduke\"\n        RF_MALWARE_ID = \"KeKua6\"\n        RF_THREATACTOR = \"APT29\"\n        RF_THREATACTOR_ID = \"O7NRMb\"\n\n   strings:\n      $s1 = \"http://10.1.1.1:8080\" fullword ascii\n      $s2 = \"file.bin\" fullword ascii\n      $s3 = \"DefPipe\" fullword ascii\n      $s4 = \"pipe: \\\\\\\\%s\\\\pipe\\\\%s\" fullword ascii\n      $s5 = \"proc:  %d %s\" fullword ascii\n      $s6 = \"meth:  %s %d\" fullword ascii\n      $s7 = \"0x%08x %s\\\\n\" fullword ascii\n      $s8 = \"%5d 0x%08x %s\\\\n\" fullword ascii\n      $s9 = \"%5d Error:     %s\" fullword ascii\n      $socket1 = \"%s:%d - %s:%d\\\\n\" fullword ascii\n      $socket2 = \"idle\\\\n\" fullword ascii\n      $socket3 = \"stop\\\\n\" fullword ascii\n      $socket4 = \"accept \" fullword ascii\n      $socket5 = \"connect \" fullword ascii\n      $socket6 = \"listen \" fullword ascii\n      $socket7 = \"%d %s\\\\n\" fullword ascii\n      $http_struct1 = \"Content-Transfer-Encoding:\
                      \ %s\" fullword ascii\n      $http_struct2 = \"Content-Disposition: form-data; name=\\\"%s\\\"; filename=\\\"%s\\\"\" fullword ascii\n      $http_struct3 = \"salesappliances.com:80\" fullword ascii\n      $http_struct4 = \"host:  %s:%d\" fullword ascii\n      $http_struct5 = \"%s:%d - %s:%d\" fullword ascii\n      $http_struct6 = \"--------------JiM9t8g7j8KoJkLJlKqka8dbo7q5z4v5u3o4z\" fullword ascii\n      $http_struct7 = \"Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/47.0.2526.111 Safari/537.36\" fullword ascii\n      $http_struct8 = \"login: %s\\\\%s\" fullword ascii\n      $http_struct9 = \"xfiles\" fullword ascii\n   condition:\n      uint16(0) == 0x5a4d and filesize < 800KB and\n      (\n        (7 of ($s*) or 6 of ($http_struct*) or all of ($socket*))\n        )\n}\n\nrule MAL_wellmail_elf\n{\n    meta:\n        author = \"LKAYE, Insikt Group, Recorded Future\"\n        date = \"2021-01-25\"\n        description = \"rule for\
