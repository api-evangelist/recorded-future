components:
  schemas:
    DetectionRuleSet:
      type: object
      properties:
        id:
          type: string
          example: doc:XYZW
          description: Document ID (doc:XXXXX)
        type:
          $ref: '#/components/schemas/DetectionRuleType'
        title:
          type: string
          example: Snort Rules for CVE-2021-44228 Exploitation Attempts
          description: Insikt Group note title describing the threat
        description:
          type: string
          example: 'There are a number of publicly-available Snort rules to detect common methods of  CVE-2021-44228 (Log4Shell remote code execution) exploit attempts. Insikt Group  has created several new, supplementary rules to detect potential exploitation attempts  using less common methods, including those using encoding or obfuscation.

            '
          description: Detailed threat analysis narrative
        rules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: APT_RU_APT29_FatDuke_loader
              description:
                type: string
                example: rule to detect fatduke loader
              file_name:
                type: string
                example: MAL_Kwampirs.yar
                description: Suggested filename for the rule
              entities:
                type: array
                items:
                  $ref: '#/components/schemas/DetectionRuleEntity'
                description: Associated entities (MITRE ATT&CK techniques, malware families, hashes).
              content:
                $ref: '#/components/schemas/DetectionRuleContent'
                description: Full rule source code (YARA rule, Sigma YAML, or Snort signature)
            required:
            - content
          description: Detection rules with deployable source code.
        created:
          $ref: '#/components/schemas/DateTime'
        updated:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - type
      - title
      - description
      - rules
      - created
      - updated
      description: A detection rule set containing deployable source code and associated metadata.
    DateTimeRange:
      type: object
      properties:
        before:
          $ref: '#/components/schemas/DateTime'
        after:
          $ref: '#/components/schemas/DateTime'
    DetectionRuleContent:
      type: string
      description: Full rule source code (YARA rule, Sigma YAML, or Snort signature)
    EntityId:
      type: string
      example: XYZW
    EntityTypeName:
      type: string
      description: Additional information about entity types is provided by the /entity/types endpoint. It can be used to find the display name of the entity type.
      example: IpAddress
    DetectionRuleResult:
      type: object
      properties:
        count:
          type: integer
          format: int32
          example: 1
          description: Number of results in this page
        total_count:
          type: integer
          format: int32
          example: 10
          description: Total matching results across all pages
        result:
          type: array
          items:
            $ref: '#/components/schemas/DetectionRuleSet'
          description: Array of detection rule note objects.
        next_offset:
          type: string
          description: Cursor-based pagination token for next page
      required:
      - count
      - total_count
      - result
      description: Search results for Insikt Group detection rules containing deployable YARA, Sigma, and Snort rule source code.
    DetectionRuleType:
      type: string
      enum:
      - sigma
      - yara
      - snort
      description: "The type of a Detection Rule Available types:\n  * sigma: Sigma rule\n  * yara: YARA rule\n  * snort: Snort rule\n"
      example: sigma
    DetectionRuleEntity:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        type:
          $ref: '#/components/schemas/EntityTypeName'
        name:
          type: string
        display_name:
          type: string
          description: Human-readable name with context
      required:
      - id
      - type
      - name
      description: An entity that is associated with a Detection rule, e.g. a MITRE ATT&CK tag or a Malware.
      example:
        id: kvXvR5
        type: CyberVulnerability
        name: CVE-2021-44228
        display_name: CVE-2021-44228 (Log4Shell)
    DateTime:
      type: string
      format: date-time
      example: '2017-07-21T17:32:28Z'
    DetectionRuleFilter:
      type: object
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/DetectionRuleType'
          description: 'Filters on type of detection rules, applied as a logical "OR". The following values are allowed: `yara`, `sigma`, and `snort`.'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/EntityId'
          description: An array of entities that may be associated with a given detection rule. All values in the array must be valid Recorded Future entity IDs. Use **Entity Match** to lookup entity IDs. Values in this filter are applied as a logical "AND".
        created:
          $ref: '#/components/schemas/DateTimeRange'
          description: Filters the date range a rule should have been created. The DateTime string should be in a string format, e.g., "2017-07-21T17:32:28Z"
        updated:
          $ref: '#/components/schemas/DateTimeRange'
          description: Similar to the `created` filter but specifies the date range in which a rule should have been updated. When first created, the update date of a rule is the same as its create date.
        doc_id:
          type: string
          description: Will look for a specific Insikt Note document ID associated with detection rules
        title:
          type: string
          description: Filters as a free text search for Insikt Notes associated with detection rules
      example:
        types:
        - yara
        entities:
        - mitre:T1486
        - kK5UbE
        created:
          after: '2022-02-10T12:00:00.000Z'
          before: '2022-03-10T00:00:00.000Z'
        doc_id: doc:lmRPGB
        title: Ransomware
      description: Filters Insikt Notes and the associated detection rules.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable description of the error.
        status_code:
          type: integer
          description: HTTP status code of the response.
        trace_id:
          type: string
          description: Unique request identifier to reference when contacting support.
      required:
      - message
      - status_code
