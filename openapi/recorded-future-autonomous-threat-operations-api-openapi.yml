openapi: 3.1.1
info:
  title: Autonomous Threat Operations API
  description: APIs for interacting with Recorded Future Autonomous Threat Operations
  contact:
    name: Threat Intelligence Team
  version: 1.0.0
  x-rf-service-id: service:autonomous-threat-operations
servers:
- url: https://api.recordedfuture.com/autonomous-threat-operations
security:
- key: []
- idp: []
paths:
  /v1/detection/profiles/query:
    post:
      tags:
      - Threat Detection
      summary: Query Profiles
      description: Discover threat detection profiles with continuously-updated indicators and detection rules.
      operationId: threatDetectionProfilesQuery
      requestBody:
        $ref: '#/components/requestBodies/ProfileQuery'
      responses:
        '200':
          description: List of threat detection profiles matching the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/ProfileId'
                        name:
                          type: string
                          description: Name of the profile
                        description:
                          type: string
                          description: Description of the profile
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                required:
                - items
              example:
                items: []
        '400':
          description: Too many profiles requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/detection/profiles/{id}/indicators:
    post:
      tags:
      - Threat Detection
      summary: Get Profile Indicators
      description: Fetch continuously-updated threat indicators from a detection profile with optional risk score enrichment.
      operationId: threatDetectionProfilesIndicators
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        $ref: '#/components/requestBodies/IndicatorQuery'
      responses:
        '200':
          $ref: '#/components/responses/Indicators'
          description: List of current indicators for the profile
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/detection/profiles/{id}/rules:
    post:
      tags:
      - Threat Detection
      summary: Get Profile Detection Rules
      description: Fetch deployable detection rules (Sigma, Snort, YARA) from a detection profile.
      operationId: threatDetectionProfilesRules
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        $ref: '#/components/requestBodies/DetectionRuleQuery'
      responses:
        '200':
          $ref: '#/components/responses/DetectionRules'
          description: List of current detection rules for the profile
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hunting/jobs/pending:
    get:
      tags:
      - Threat Hunting
      summary: Get Pending Jobs
      description: Poll for threat hunt jobs awaiting execution by an integration.
      operationId: threatHuntingJobsPending
      parameters:
      - $ref: '#/components/parameters/Integration'
      responses:
        '200':
          description: List of pending threat hunt jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/ThreatHuntJobId'
                        profile:
                          $ref: '#/components/schemas/ProfileId'
                        status:
                          $ref: '#/components/schemas/ThreatHuntJobStatus'
                        timeRange:
                          type: object
                          description: Time range of the threat hunt job
                          properties:
                            start:
                              type: string
                              format: date-time
                            end:
                              type: string
                              format: date-time
                          required:
                          - start
                          - end
                      required:
                      - id
                      - profile
                      - status
                      - timeRange
                required:
                - items
              example:
                items:
                - id: 6a0bc087-c3f5-4907-b417-745d9ea58050
                  profile: c0aca9fe-2374-4bae-b9bc-f2e8b594bde0
                  status: ready
                  organization: uhash:5XdwuI1B1E
                  timeRange:
                    start: '2026-03-04T21:14:46.155223240Z'
