  /v1/hunting/jobs/{id}/indicators:
    post:
      tags:
      - Threat Hunting
      summary: Get Job Indicators
      description: Fetch threat indicators from a completed hunt job, optionally enriched with risk scores.
      operationId: threatHuntingJobsIndicators
      parameters:
      - $ref: '#/components/parameters/ThreatHuntJobId'
      requestBody:
        $ref: '#/components/requestBodies/IndicatorQuery'
      responses:
        '200':
          $ref: '#/components/responses/Indicators'
          description: List of indicators for the threat hunt job
        '404':
          description: Threat hunt job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hunting/jobs/{id}/rules:
    post:
      tags:
      - Threat Hunting
      summary: Get Job Detection Rules
      description: Fetch detection rules from a threat hunt job scoped to its time window.
      operationId: threatHuntingJobsRules
      parameters:
      - $ref: '#/components/parameters/ThreatHuntJobId'
      requestBody:
        $ref: '#/components/requestBodies/DetectionRuleQuery'
      responses:
        '200':
          $ref: '#/components/responses/DetectionRules'
          description: List of current detection rules for the job
        '404':
          description: Threat hunt job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hunting/jobs/{id}/status:
    post:
      tags:
      - Threat Hunting
      summary: Update Job Status
      description: Transition a threat hunt job through its lifecycle (started, completed, failed) with optional outcome details.
      operationId: threatHuntingJobsStatus
      parameters:
      - $ref: '#/components/parameters/ThreatHuntJobId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - started
                  - completed
                  - failed
                message:
                  type: string
                externalId:
                  type: string
              required:
              - status
        required: true
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  previousStatus:
                    $ref: '#/components/schemas/ThreatHuntJobStatus'
                    description: Status of the job before this endpoint was called
                  currentStatus:
                    $ref: '#/components/schemas/ThreatHuntJobStatus'
                    description: Current status of the job after this endpoint was called
                description: Result of the status transition, showing both the previous and current status of the threat hunt job.
        '404':
          description: Threat hunt job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hunting/profiles/query:
    post:
      tags:
      - Threat Hunting
      summary: Query Profiles
      description: Discover threat hunting profiles configured for your organization with schedules and lookback windows.
      operationId: threatHuntingProfilesQuery
      requestBody:
        $ref: '#/components/requestBodies/ProfileQuery'
      responses:
        '200':
          description: List of threat hunt profiles matching the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/ProfileId'
                        name:
                          type: string
                          description: Name of the profile
                        description:
                          type: string
                          description: Description of the profile
                        nextRun:
                          type: string
                          format: date-time
                          description: The next time this profile is scheduled to run
                        schedule:
                          type: string
                          description: The schedule for the profile
                        lookback:
                          type: integer
                          format: int32
                          description: Threat hunt lookback in seconds
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                required:
                - items
              example:
                items:
                - id: c0aca9fe-2374-4bae-b9bc-f2e8b594bde0
                  name: Blue Bravo - Behavioral Hunt
                  enterprise: uhash:2FLAPRFn9w
                  lookback: 86400
                  organization: uhash:5XdwuI1B1E
                  createdAt: '2026-03-05T21:14:46.023542378Z'
                  updatedAt: '2026-03-05T21:14:46.023542378Z'
        '400':
          description: Too many profiles requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/prevention/profiles/query:
    post:
      tags:
      - Threat Prevention
      summary: Query Profiles
      description: Discover threat prevention profiles with curated block lists of confirmed-malicious indicators.
      operationId: threatPreventionProfilesQuery
      requestBody:
        $ref: '#/components/requestBodies/ProfileQuery'
      responses:
        '200':
          description: List of threat prevention profiles matching the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/ProfileId'
                        name:
                          type: string
                          description: Name of the profile
                        description:
                          type: string
                          description: Description of the profile
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                required:
                - items
              example:
                items: []
        '400':
          description: Too many profiles requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/prevention/profiles/{id}/indicators:
    post:
      tags:
      - Threat Prevention
      summary: Get Profile Indicators
      description: Fetch the block list of confirmed-malicious indicators from a prevention profile.
      operationId: threatPreventionProfilesIndicators
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        $ref: '#/components/requestBodies/IndicatorQuery'
      responses:
        '200':
          $ref: '#/components/responses/Indicators'
          description: List of current indicators for the profile
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/prevention/profiles/{id}/rules:
    post:
      tags:
      - Threat Prevention
      summary: Get Profile Detection Rules
      description: Fetch supplementary detection rules from a prevention profile tagged with MITRE ATT&CK techniques.
      operationId: threatPreventionProfilesRules
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        $ref: '#/components/requestBodies/DetectionRuleQuery'
      responses:
        '200':
          $ref: '#/components/responses/DetectionRules'
          description: List of current detection rules for the profile
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sources:
    post:
      tags:
      - Intelligence Sources
      summary: Create Source
      description: Register a new custom intelligence source as a container for publishing threat reports.
      operationId: sourcesCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the source
                description:
                  type: string
                  description: Description of the source
              required:
              - name
        required: true
      responses:
        '200':
          description: Intelligence source was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Intelligence Sources
      summary: Get Sources
      description: List all custom intelligence sources in your account.
      operationId: sourcesList
      responses:
        '200':
          description: List of all custom intelligence sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
              example:
              - id: df9131f6-0dfd-4f8f-83e1-62aad16d3b28
                name: Test Source R3 Updated
                description: Updated by R3 assessment
                createdAt: '2026-03-12T22:19:37.336952005Z'
                updatedAt: '2026-03-13T08:16:21.484003550Z'
  /v1/sources/{id}:
    get:
      tags:
      - Intelligence Sources
      summary: Get Source
      description: Retrieve metadata for a specific custom intelligence source.
      operationId: sourcesGet
      parameters:
      - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Intelligence source corresponding to the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              example:
                id: df9131f6-0dfd-4f8f-83e1-62aad16d3b28
                name: Test Source R3 Updated
                description: Updated by R3 assessment
                createdAt: '2026-03-12T22:19:37.336952005Z'
                updatedAt: '2026-03-13T08:16:21.484003550Z'
        '404':
          description: Intelligence source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Intelligence Sources
      summary: Update Source
      description: Modify the name or description of an existing custom intelligence source.
      operationId: sourcesUpdate
      parameters:
      - $ref: '#/components/parameters/SourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Name of the source
                description:
                  type: string
                  description: Description of the source
        required: true
      responses:
        '200':
          description: Intelligence source was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              example:
                id: df9131f6-0dfd-4f8f-83e1-62aad16d3b28
                name: Test Source R3 Updated
                description: Updated by R3 assessment
                createdAt: '2026-03-12T22:19:37.336952005Z'
                updatedAt: '2026-06-03T03:34:58.604353532Z'
        '400':
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Intelligence source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sources/{id}/reports:
    post:
      tags:
      - Intelligence Sources
      summary: Publish Reports
      description: Submit threat intelligence reports with observables, TTPs, and threat actor associations to a custom source.
      operationId: sourcesPublishReports
      parameters:
      - $ref: '#/components/parameters/SourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Intelligence Report
                properties:
                  externalId:
                    type: string
                    description: Report identifier from the external intelligence source
                    example: 1234-112233-abcd
                  observables:
                    type: array
                    items:
                      type: string
                      description: Recorded Future entity id
                    minItems: 1
                    description: IPs, domains, hashes and URLs related to the report
                    example:
                    - ip:127.0.0.1
                  tlp:
                    type: string
                    enum:
                    - clear
                    - green
                    - amber
                    - amber+strict
                    - red
                    description: TLP
                    example: green
                  ttp:
                    type: array
                    items:
                      type: string
                      description: Recorded Future entity id
                    description: TTPs
                    example:
                    - mitre:T1082
                  malware:
                    type: array
                    items:
                      type: string
                      description: Recorded Future entity id
                    description: Malware
                    example:
                    - Kl70JR
                    - MZycd3
                  threatActor:
                    type: array
                    items:
                      type: string
                      description: Recorded Future entity id
                    description: Threat Actors
                    example:
                    - I2QcS_
                  timestamp:
                    type: string
                    format: date-time
                    description: Date and time of the reported event
                required:
                - observables
        required: true
      responses:
        '202':
          description: Reports were published for processing
        '400':
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Intelligence source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid malware, threat actor or TTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Source:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
          description: Name of the source
        description:
          type: string
          description: Description of the source
        createdAt:
          type: string
          format: date-time
          description: Date and time the source was created
        updatedAt:
          type: string
          format: date-time
          description: Date and time the source was last updated
      required:
      - id
      - name
      - createdAt
      - updatedAt
    SourceId:
      type: string
      format: uuid
      description: Identity of the source
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable description of the error.
        status_code:
          type: integer
          description: HTTP status code of the response.
        trace_id:
          type: string
          description: Unique request identifier to reference when contacting support.
      required:
      - message
      - status_code
    HashAlgorithm:
      type: string
      enum:
      - MD5
      - SHA-1
      - SHA-256
      - SHA-384
      - SHA-512
    Indicator:
      type: object
      properties:
        type:
          type: string
          enum:
          - domain
          - hash
          - ip
          - url
        observable:
          type: string
          minLength: 10
          maxLength: 1000
        algorithm:
          $ref: '#/components/schemas/HashAlgorithm'
        risk:
          type: object
          properties:
            score:
              type: integer
              format: int32
              minimum: 0
              maximum: 99
            rules:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique risk rule id
                  level:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 5
                    description: Risk level of this risk rule
                  sightings:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Number of sightings causing this risk rule to trigger
                  description:
                    type: string
                    example: Description of the details on why this rule triggered
                  timestamp:
                    type: string
