  /triage/contexts:
    get:
      summary: Lookup all available risk contexts
      tags:
      - Soar
      description: Retrieve configuration for the malware, phishing, and c2 risk contexts, including default thresholds used by the triage endpoint.
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
              example:
                malware:
                  default_threshold: 65
                  description: The Recorded Future Malware Risk Context use case is designed to identify potential malware infections. Recorded Future risk data is used to evaluate IOCs submitted by the end user and produce a suggested verdict for malware events.
                  datagroup:
                    ip:
                      rule:
                        maxCount: 1
                    url:
                      rule:
                        maxCount: 5
                    domain:
                      rule:
                        maxCount: 2
                    vulnerability:
                      rule:
                        maxCount: 2
                  default_threshold_type: max
                  name: SOAR API Malware Risk Context
                phishing:
                  default_threshold: 65
                  description: The Recorded Future Phishing Risk Context use case is designed to identify potential phishing event. Recorded Future risk data is used to evaluate IOCs submitted by the end user and produce a suggested verdict for phishing events.
                  datagroup:
                    ip:
                      rule:
                        maxCount: 3
                    url:
                      rule:
                        maxCount: 2
                    domain:
                      rule:
                        maxCount: 3
                  default_threshold_type: max
                  name: SOAR API Phishing Risk Context
                c2:
                  default_threshold: 80
                  description: The Recorded Future Command & Control Risk Context use case is designed to identify potential command & control communications. Recorded Future risk data is used to evaluate IOCs submitted by the end user and produce a suggested verdict for command & control events.
                  datagroup:
                    ip:
                      rule:
                        maxCount: 5
                    url:
                      rule:
                        maxCount: 1
                    domain:
                      rule:
                        maxCount: 1
                  default_threshold_type: max
                  name: SOAR API Command & Control Risk Context
