components:
  parameters:
    MetadataQueryParameter:
      in: query
      name: metadata
      description: Include metadata in response. Annotates the response with additional metadata explaining the response data elements.
      schema:
        type: boolean
        default: false
      required: false
    ContextNameParameter:
      in: path
      name: context_name
      description: The context in which to evaluate the given entities. Available contexts can be fetched using the separate endpoint.
      schema:
        type: string
      required: true
    FormatQueryParameter:
      in: query
      name: format
      description: Allows for an output format suitable for Splunk SOAR (previously "Phantom"). If no value is given, the default format (used in the Enrichment endpoint) will be used.
      schema:
        type: string
        enum:
        - phantom
      required: false
    ThresholdQueryParameter:
      in: query
      name: threshold
      description: Determines which risk score should be used to deem an entity risky. Each context has its own default value and depends on the context.
      schema:
        type: integer
      required: false
    ThresholdTypeQueryParameter:
      in: query
      name: threshold_type
      description: Determines if the set of entities are deemed risky if a single entity is above the threshold (max) or if all entities have to be above the threshold (min). The default is specified by the context but is max for all contexts currently defined.
      schema:
        type: string
        enum:
        - min
        - max
        default: max
      required: false
  schemas:
    EnrichRequest:
      type: object
      description: Entities to be enriched, grouped by type up to a total of 1000 IOCs.
      properties:
        ip:
          type: array
          description: IPs to enrich
          items:
            type: string
            example: 8.8.8.8
        domain:
          type: array
          description: Domains to enrich
          items:
            type: string
            example: google.com
        url:
          type: array
          description: URLs to enrich
          items:
            type: string
            example: https://phishing-example.net
        hash:
          type: array
          description: Hashes to enrich
          items:
            type: string
            example: 458d1f83e087d0f613c505086538436d
        vulnerability:
          type: array
          description: Vulnerabilities to enrich
          items:
            type: string
            example: CVE-2021-44228
        companybydomain:
          type: array
          description: Companies to enrich, identified by their domain name.
          items:
            type: string
            example: recordedfuture.com
    EnrichResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnrichResponseData'
        counts:
          $ref: '#/components/schemas/Counts'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - data
      - counts
      description: Enrichment results with risk scores, evidence, and threat context for submitted entities.
    ResultData:
      type: array
      items:
        type: object
        properties:
          risk:
            type: object
            properties:
              score:
                type: number
                description: Overall risk score for this entity (0-99).
                example: 15
              level:
                type: number
                description: Risk level category (0=None, 1=Unusual, 2=Suspicious, 3=Malicious, 4=Very Malicious).
                example: 1
              context:
                type: object
                description: Risk context data keyed by context name (e.g., phishing, c2, malware, public). Each key represents a risk context use case.
                additionalProperties:
                  type: object
                  properties:
                    score:
                      type: number
                      description: Risk score within this context (0-99).
                      example: 15
                    summary:
                      type: array
                      description: Summary of risk rules triggered in this context, grouped by severity level.
                      items:
                        type: object
                        properties:
                          level:
                            type: number
                            description: Severity level of the rules.
                            example: 1
                          count:
                            type: number
                            description: Number of rules triggered at this level.
                            example: 3
                    rule:
                      type: object
                      description: Aggregate rule statistics for this context.
                      properties:
                        count:
                          type: integer
                          description: Number of rules triggered in this context.
                          example: 0
                        maxCount:
                          type: integer
                          description: Maximum number of rules available for this context.
                          example: 5
                    mostCriticalRule:
                      type: string
                      description: Name of the most critical rule triggered in this context. Empty string if no rules triggered.
                      example: ''
                  required:
                  - score
                  - rule
              rule:
                type: object
                description: Aggregate risk rule data for this entity across all contexts.
                properties:
                  summary:
                    type: array
                    description: Summary of triggered rules grouped by severity level.
                    items:
                      type: object
                      properties:
                        level:
                          type: number
                          description: Severity level (1=Unusual, 2=Suspicious, 3=Malicious, 4=Very Malicious).
                          example: 1
                        count:
                          type: number
                          description: Number of rules triggered at this severity level.
                          example: 3
                      required:
                      - level
                      - count
                  mostCritical:
                    type: string
                    description: Name of the most critical (highest severity) rule triggered.
                    example: Historically Reported Spam or Unwanted Content
                  count:
                    type: integer
                    description: Total number of risk rules triggered for this entity.
                    example: 3
                  maxCount:
                    type: integer
                    description: Maximum number of risk rules available for this entity type.
                    example: 52
                  evidence:
                    type: object
                    description: Evidence data keyed by rule identifier (e.g., spamSiteDetected, historicalThreatListMembership, defanged). Each key is a camelCase rule slug.
                    additionalProperties:
                      type: object
                      description: Evidence detail for a single triggered risk rule.
                      properties:
                        count:
                          type: integer
                          description: Number of times this rule was triggered.
                          example: 1
                        level:
                          type: integer
                          description: Severity level of this rule (1=Unusual, 2=Suspicious, 3=Malicious, 4=Very Malicious).
                          example: 1
                        timestamp:
                          type: string
                          format: date-time
                          description: Most recent timestamp when this rule was triggered.
                          example: '2023-08-21T15:17:38.687Z'
                        description:
                          type: string
                          description: Human-readable description of the evidence, including source references in XML-like entity tags.
                          example: '1 sighting on 1 source: Bitdefender. Detected malicious behavior from an endpoint agent via global telemetry.'
                        rule:
                          type: string
                          description: Human-readable name of the risk rule.
                          example: Historically Reported Spam or Unwanted Content
                        sightings:
                          type: integer
                          description: Number of sightings that support this rule. -1 indicates sighting count is not applicable.
                          example: 1
                        mitigation:
                          type: string
                          description: Suggested mitigation action for this risk rule. Empty string if none.
                      required:
                      - count
                      - level
                      - timestamp
                      - rule
                required:
                - count
                - maxCount
            required:
            - score
            - level
            - context
            - rule
          entity:
            type: object
            properties:
              id:
                type: string
                example: idn:google.com
              name:
                type: string
                example: google.com
              type:
                type: string
                example: InternetDomainName
              description:
                type: string
            required:
            - id
            - name
            - type
        required:
        - risk
        - entity
      description: Individual enrichment result for a single entity.
    EnrichResponseData:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/ResultData'
      required:
      - results
      description: Data wrapper containing enrichment result entries.
    Counts:
      type: object
      properties:
        returned:
          type: number
          example: 1
        total:
          type: number
          example: 1000
      required:
      - returned
      - total
      description: Pagination counts for list responses.
    Metadata:
      type: object
      properties:
        entries:
          type: array
          description: Metadata entries providing additional context about the response data elements.
          items:
            type: object
            properties:
              key:
                type: string
                description: The metadata key or field name.
              value:
                type: string
                description: The metadata value or description.
      description: Response metadata with additional context about the enrichment operation. Only included when the metadata query parameter is set to true.
    ContextResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Context'
      description: Response wrapper for triage context operations.
      properties:
        malware:
          $ref: '#/components/schemas/Context'
        phishing:
          $ref: '#/components/schemas/Context'
        c2:
          $ref: '#/components/schemas/Context'
    Context:
      type: object
      properties:
        default_threshold:
          type: integer
          description: Default threshold to determinate verdict
          minimum: 0
          maximum: 100
          example: 65
        description:
          type: string
          example: The Recorded Future Phishing Risk Context use case is designed to identify potential phishing event. Recorded Future risk data is used to evaluate IOCs submitted by the end user and produce a suggested verdict for phishing events.
        datagroup:
          type: object
          description: Includes information on all data groups available for this context
          additionalProperties:
            type: object
            properties:
              rule:
                type: object
                properties:
                  maxCount:
                    type: integer
                    example: 2
      default_threshold_type:
        type: string
        enum:
        - min
        - max
        description: Default algorithm to use the threshold in
        example: max
        default: max
      name:
        type: string
        example: SOAR API Phishing Risk Context
      description: A triage context configuration defining risk thresholds and data group settings for automated triage decisions.
    TriageData:
      type: object
      properties:
        threshold_type:
          type: string
          enum:
          - min
          - max
          example: max
        context:
          type: string
          example: c2
        verdict:
          type: boolean
        threshold:
          type: integer
          description: Default value depends on the context
          minimum: 0
          maximum: 100
          example: 80
        scores:
          type: object
          properties:
            min:
              type: integer
              example: 0
            max:
              type: integer
              example: 20
      description: Automated triage verdict for an entity based on risk threshold evaluation.
    TriageResponseData:
      type: object
      properties:
        triage:
          $ref: '#/components/schemas/TriageData'
        results:
          $ref: '#/components/schemas/ResultData'
      description: Data wrapper containing triage verdicts and enrichment results.
    TriageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TriageResponseData'
