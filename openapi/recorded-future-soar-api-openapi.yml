                            description: '3492 sightings on 95 sources including: <e id=source:Jv_xrR>PasteBin</e>, <e id=source:QhLYm5>Reddit InfoSec Comments</e>, <e id=source:Y7TWfI>Telegram - Other Channels</e>, <e id=source:wqZUMS>CSOonline.com</e>, <e id=source:POs2tz>FreeBufCOM</e>. Most recent tweet: <e id=JFmVA9>Burp Suite</e>のActiveScan++が重大なReact2Shell脆弱性の検知に対応し、ゼロデイ攻撃を早期に察知できるようになった。 Reactアプリの<e id=JQ3ldp>SSRF</e>連鎖でRCEに至る欠陥を自動スキャンで発見できるようになり、現場の防御力が向上すると期待される。 今回の更新では、Reactアプリにおけるサーバ側でのリクエスト悪用により任意コマンド実行へつながる問題に対応し、通常のスキャン運用のままで危険な挙動を検出可能となった。 <e id=R53O1>ActiveScan++</e>は標準の<e id=RK67Cj>アクティブ</e>／パッシブ検査を拡張し、ホストヘッダー操作によるパスワードリセット汚染、キャッシュ汚染、DNSリバインディングなど、一般的なスキャナーが見逃しやすい微妙な挙動を低負荷で洗い出す。 さらに、<e id=HFFT7l>Shellshock</e>や<e id=kvXvR5>Log4Shell</e>など著名な脆弱性に加え、React2Shellが新たに対象となり、<e id=LQEhvp>Unicode</e>回避検知、ファジング時のパッシブ検査自動発火、HTTP基本認証の挿入点追加など、テスター向けの機能が強化された。 利用は容易で、通常のアクティブスキャンを実行するだけで結果が重み付けされて<e id=6Nim_K>ダッシュボード</e>に表示される。 React周辺で<e id=JQ3ldp>SSRF</e>悪用が増える中、開発側には入力検証とリクエストのホワイトリスト化が求められる。
