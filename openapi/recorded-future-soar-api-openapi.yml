openapi: 3.1.1
info:
  title: Soar API
  version: 3.0.0
  description: 'The SOAR API is designed for high throughput risk checks using Recorded Future''s threat intelligence in bulk.


    It supports five IOC types, IP Address, Domain, Hash, URL and Vulnerability.


    Please read the [documentation](https://docs.recordedfuture.com/docs/soar-api-introduction) before using this API.

    '
servers:
- url: https://api.recordedfuture.com/soar/v3
paths:
  /enrichment:
    post:
      summary: Fetch risk information for a set of indicators
      tags:
      - Soar
      description: Retrieve risk scores, triggered rules, and evidence for up to 1,000 indicators across six entity types in a single batch call.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/MetadataQueryParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichRequest'
      responses:
        '200':
          description: output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichResponse'
              example:
                data:
                  results:
                  - risk:
                      context:
                        phishing:
                          summary: []
                          rule:
                            maxCount: 0
                          score: 0
                          mostCriticalRule: ''
                        malware:
                          summary: []
                          rule:
                            maxCount: 0
                          score: 90
                          mostCriticalRule: ''
                        public:
                          summary: []
                          rule:
                            maxCount: 0
                          score: 99
                          mostCriticalRule: ''
                        c2:
                          summary: []
                          rule:
                            maxCount: 0
                          score: 0
