- aid: recorded-future:collective-insights
  name: Recorded Future Collective Insights API
  description: 'Submit events captured by your security tools to your organization''s Recorded Future enterprise. Collective Insights enriches
    submissions with threat context from Recorded Future Intelligence Graph to provide your organization''s enterprise with enhanced and actionable
    intelligence.  - **Usage Details**:   * This API throttles the amount of detections you can send, the default is a max burst of 100k IOCs,
    or ~1 IOCs per second. Please contact your customer success manager if you feel this limit is not meeting your needs.   * Organizations using
    Collective Insights benefit by having their Recorded Future intelligence enhanced by shared data. In addition, non-attributable data from
    their submissions can be used to benefit other Recorded Future clients. - **Prerequisites**:   * Recorded Future module license   * Recorded
    Future API [token](https://docs.recordedfuture.com/reference/get-starte'
