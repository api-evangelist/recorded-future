  description: The Recorded Future Intelligence Cloud REST API (api.recordedfuture.com) provides programmatic access to threat intelligence sourced
    from over a million open-web, dark-web, technical, and customer feeds and structured by the Intelligence Graph. The API supports lookups for
    indicators of compromise (IPs, domains, hashes, URLs, vulnerabilities), entity context, risk scoring, alert and watchlist management, and
    intelligence search. Detailed reference documentation and credentials are issued to Recorded Future customers through the support portal and
    customer community.
