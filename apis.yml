- aid: recorded-future:asi-project
  name: Recorded Future ASI Project API
  description: The Attack Surface Intelligence (ASI) Project API is designed to allow you full-featured access to all of the `Assets` within all
    of the `Project`s as well as , most importantly, the `Exposures` that our system has identified on those assets, including proposed remediations.  You
    can create new user-defined `Tags` and apply them to `Assets` either individually or in bulk.  You can use either the GET-based listing endpoint
    to find assets or the /_search endpoint which accepts a more structured request and, in the future, will allow for even more complex boolean
    queries.  Using it only requires a standard Security Trails API access key.
